# Usage: dispatch on master with packages set to the exact versions to tag latest, for example:
# @tinycloud/cli@1.4.0 @tinycloud/web-sdk@3.7.0 @tinycloud/node-sdk@3.7.0 @tinycloud/sdk-core@3.7.0 @tinycloud/sdk-services@3.7.0 @tinycloud/mcp@0.8.2 @tinycloud/courier@0.3.2 @tinycloud/share-envelope@1.3.0 @tinycloud/share-sdk@1.4.0 @tinycloud/replica@0.3.4 @tinycloud/operations@0.7.6 @tinycloud/server@2.5.13 @tinycloud/vfs@0.2.13
# Details: TC-2202
name: Roll back npm latest tags

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Space- or newline-separated exact package versions
        required: true
        type: string
      confirm:
        description: Type rollback to move latest tags
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::This workflow can run only on the default branch (master)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node for npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Test rollback validation
        run: node --test scripts/npm-latest-rollback.test.mjs

      - name: Preflight versions and move latest tags
        run: node scripts/npm-latest-rollback.mjs
        env:
          PACKAGES: ${{ inputs.packages }}
          CONFIRM: ${{ inputs.confirm }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
