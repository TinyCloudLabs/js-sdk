# Build & deploy the TinyCloud SDK Atlas to GitHub Pages.
# Triggers on push to master AND nightly (so drift is detected even
# when no one is pushing).
name: atlas

on:
  push:
    branches: [master]
    paths:
      - 'atlas/**'
      - 'packages/**'
      - '.github/workflows/atlas.yml'
  schedule:
    # Daily at 06:00 UTC — picks up package changes, refreshes drift.json
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # rebuild.mjs reads `git rev-parse HEAD`

      # Astro 7 requires Node >=22.22.0; pin it rather than rely on the runner default.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.0
      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('atlas/bun.lock') }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Rebuild atlas data
        run: bun run atlas:rebuild

      - name: Build static site → ../docs/atlas/
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
