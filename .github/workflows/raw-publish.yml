name: Raw Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Must be latest for this stable hotfix'
        type: string
        default: latest
        required: true
      dry_run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: true
      source_sha:
        description: 'Full reviewed hotfix commit SHA'
        type: string
        required: true
      package:
        description: 'Allowlisted release selection; single packages are recovery only'
        type: choice
        options: [both, sdk-services, cli]
        default: both
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Raw Publish
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      PACKAGE: ${{ inputs.package }}
      DRY_RUN: ${{ inputs.dry_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate dispatch before installation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == latest ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF" == refs/heads/feat/tc-2205-cli-1.6.6-hotfix ]]
          case "$PACKAGE" in both|sdk-services|cli) ;; *) exit 1 ;; esac
          case "$DRY_RUN" in true|false) ;; *) exit 1 ;; esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert reviewed checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$RELEASE_SHA" == "$GITHUB_SHA" ]]

      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14
          no-cache: true

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown

      - name: Setup Node for packing and publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install committed dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          git diff --exit-code
          git diff --cached --exit-code

      - name: Build all packages
        run: bun run build
        env:
          BUILD_SETUP_ENABLED: true

      - name: Prepare fail-closed validation and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hotfix-pack"
          cat > "$RUNNER_TEMP/hotfix-check.cjs" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const base = 'dcee98981f6d16b9edd02cecc25b16923edf08f4';
          const out = path.join(process.env.RUNNER_TEMP, 'hotfix-pack');
          const sha = process.env.RELEASE_SHA;
          const selection = process.env.PACKAGE;
          const packages = ['bootstrap', 'cli', 'courier', 'mcp', 'node-sdk', 'operations',
            'replica', 'sdk-core', 'sdk-services', 'server', 'share-envelope', 'share-sdk',
            'vfs', 'web-sdk', 'node-sdk-wasm', 'web-sdk-wasm'];
          const targets = {
            'sdk-services': { version: '3.11.1', previous: '3.11.0' },
            cli: { version: '1.6.6', previous: '1.6.5' },
          };
          const selected = name => selection === 'both' || selection === name;
          const json = file => JSON.parse(fs.readFileSync(file, 'utf8'));
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const save = (name, value) => fs.writeFileSync(path.join(out, name), JSON.stringify(value, null, 2) + '\n');
          const manifest = name => json(`packages/${name}/package.json`);
          const original = name => JSON.parse(git('show', `${base}:packages/${name}/package.json`));
          function manifests() {
            assert(!fs.existsSync('.changeset/pre.json'), 'prerelease mode is forbidden');
            const files = git('ls-tree', '-r', '--name-only', base).split('\n')
              .filter(file => file.startsWith('packages/') && file.endsWith('/package.json'));
            for (const file of files) {
              const before = JSON.parse(git('show', `${base}:${file}`));
              const current = json(file);
              const name = Object.keys(targets).find(name => file === `packages/${name}/package.json`);
              if (name) {
                before.version = targets[name].version;
                if (name === 'cli') before.dependencies['@tinycloud/sdk-services'] = '3.11.1';
              }
              assert.deepEqual(current, before, `unexpected manifest change: ${file}`);
            }
            for (const name of Object.keys(targets)) {
              const pkg = manifest(name);
              assert.equal(pkg.name, `@tinycloud/${name}`);
              assert.equal(pkg.version, targets[name].version);
              assert(!pkg.private, 'target must be public');
              for (const kind of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
                for (const spec of Object.values(pkg[kind] || {})) {
                  assert(typeof spec === 'string' && !/workspace:|\d+\.\d+\.\d+-/.test(spec),
                    `workspace or prerelease runtime spec: ${spec}`);
                }
              }
            }
            assert.equal(manifest('cli').dependencies['@tinycloud/sdk-services'], '3.11.1');
            // This stable tree tracks four generated CLI outputs. Rebuild them for
            // packing, but never allow installation/build to rewrite tracked source.
            const generated = new Set(['packages/cli/dist/index.js', 'packages/cli/dist/index.js.map',
              'packages/cli/dist/legacy-entry.js', 'packages/cli/dist/legacy-entry.js.map']);
            const changed = git('diff', '--name-only', 'HEAD').split('\n').filter(Boolean);
            assert(changed.every(file => generated.has(file)), 'tracked source changed during install/build');
          }
          async function document(name, phase) {
            const response = await fetch(`https://registry.npmjs.org/@tinycloud%2f${name}`, {
              headers: { 'Cache-Control': 'no-cache' }, cache: 'no-store',
              signal: AbortSignal.timeout(30000),
            });
            assert.equal(response.status, 200, `registry HTTP status: ${name}`);
            const doc = await response.json();
            assert.equal(doc.name, `@tinycloud/${name}`);
            assert(doc.versions && typeof doc.versions === 'object' && !Array.isArray(doc.versions));
            assert(doc['dist-tags'] && typeof doc['dist-tags'] === 'object' && !Array.isArray(doc['dist-tags']));
            for (const [tag, version] of Object.entries(doc['dist-tags'])) {
              assert.equal(typeof version, 'string');
              assert(doc.versions[version], `unresolved tag: ${name}/${tag}`);
            }
            save(`${phase}-${name}.json`, doc);
            return doc;
          }
          async function snapshot(phase) {
            const tags = {};
            for (const name of packages) tags[name] = (await document(name, phase))['dist-tags'];
            save(`${phase}-tags.json`, tags);
            return tags;
          }
          async function preflight() {
            manifests();
            await snapshot('before');
            for (const name of Object.keys(targets)) {
              if (!selected(name)) continue;
              const doc = json(path.join(out, `before-${name}.json`));
              assert(!Object.hasOwn(doc.versions, targets[name].version), `${name} target already exists; inspect publication evidence`);
              assert.equal(doc['dist-tags'].latest, targets[name].previous, `${name} latest moved`);
            }
          }
          function unpack(tarball, directory) {
            fs.mkdirSync(directory, { recursive: true });
            const entries = execFileSync('tar', ['-tzf', tarball], { encoding: 'utf8' }).trim().split('\n');
            assert(entries.every(file => file.startsWith('package/') && !file.split('/').includes('..')));
            execFileSync('tar', ['-xzf', tarball, '-C', directory, '--no-same-owner']);
            return entries.filter(file => !file.endsWith('/'));
          }
          async function pack(name) {
            assert(Object.hasOwn(targets, name));
            const cwd = `packages/${name}`;
            const result = JSON.parse(execFileSync('npm', ['pack', '--ignore-scripts', '--json', '--pack-destination', out],
              { cwd, encoding: 'utf8' }));
            save(`${name}-pack.json`, result);
            assert.equal(result.length, 1);
            const info = result[0];
            assert.equal(info.name, `@tinycloud/${name}`);
            assert.equal(info.version, targets[name].version);
            assert.equal(info.filename, `tinycloud-${name}-${targets[name].version}.tgz`);
            const tarball = path.join(out, info.filename);
            const integrity = 'sha512-' + createHash('sha512').update(fs.readFileSync(tarball)).digest('base64');
            assert.equal(info.integrity, integrity);
            const directory = path.join(out, `${name}-unpacked`);
            const files = unpack(tarball, directory).map(file => file.slice('package/'.length));
            save(`${name}-files.json`, files);
            assert.deepEqual(json(path.join(directory, 'package/package.json')), manifest(name));
            assert(!Object.hasOwn(json(path.join(directory, 'package/package.json')), 'gitHead'),
              'tarball publication must not carry gitHead');
            for (const file of files) {
              assert(/^(dist\/|bin\/|skills\/|package\.json$|README(?:\.md)?$|LICENSE(?:\.[^/]+)?$)/i.test(file), `unexpected packed file: ${file}`);
              assert(!/(^|\/)(\.npmrc|\.env[^/]*|profiles?|credentials?)(\/|$)|\.(sqlite|db)(-|$)|\.tsx?$/.test(file.replace(/\.d\.(ts|cts)$/, '.types')), `sensitive/source file: ${file}`);
            }
            // Exact published CLI 1.6.5 and services 3.11.0 inventories (registry tarballs).
            const publishedFiles = {
              'cli': [
                "README.md",
                "bin/tc",
                "bin/tinycloud",
                "dist/courier-entry.d.ts",
                "dist/courier-entry.js",
                "dist/courier-entry.js.map",
                "dist/index.d.ts",
                "dist/index.js",
                "dist/index.js.map",
                "dist/legacy-entry.d.ts",
                "dist/legacy-entry.js",
                "dist/legacy-entry.js.map",
                "package.json",
                "skills/courier/SKILL.md",
                "skills/courier/release.json",
                "skills/courier/start.md",
                "skills/tinycloud-cli/AUTH.md",
                "skills/tinycloud-cli/INSTALL.md",
                "skills/tinycloud-cli/REFERENCE.md",
                "skills/tinycloud-cli/SDK.md",
                "skills/tinycloud-cli/SKILL.md",
                "skills/tinycloud-cli/release.json",
              ],
              'sdk-services': [
                "dist/BaseService-Ma2MwJAd.d.ts",
                "dist/BaseService-O0iyuFLk.d.cts",
                "dist/IHooksService-4QNODVy6.d.cts",
                "dist/IHooksService-CvTpJbQD.d.ts",
                "dist/ISQLService-Aly1CBsW.d.ts",
                "dist/ISQLService-BOgWzHLT.d.cts",
                "dist/context.cjs",
                "dist/context.cjs.map",
                "dist/context.d.cts",
                "dist/context.d.ts",
                "dist/context.js",
                "dist/context.js.map",
                "dist/encryption/index.cjs",
                "dist/encryption/index.cjs.map",
                "dist/encryption/index.d.cts",
                "dist/encryption/index.d.ts",
                "dist/encryption/index.js",
                "dist/encryption/index.js.map",
                "dist/encryption/named-keys.cjs",
                "dist/encryption/named-keys.cjs.map",
                "dist/encryption/named-keys.d.cts",
                "dist/encryption/named-keys.d.ts",
                "dist/encryption/named-keys.js",
                "dist/encryption/named-keys.js.map",
                "dist/encryption/resource.cjs",
                "dist/encryption/resource.cjs.map",
                "dist/encryption/resource.d.cts",
                "dist/encryption/resource.d.ts",
                "dist/encryption/resource.js",
                "dist/encryption/resource.js.map",
                "dist/feed/index.cjs",
                "dist/feed/index.cjs.map",
                "dist/feed/index.d.cts",
                "dist/feed/index.d.ts",
                "dist/feed/index.js",
                "dist/feed/index.js.map",
                "dist/index.cjs",
                "dist/index.cjs.map",
                "dist/index.d.cts",
                "dist/index.d.ts",
                "dist/index.js",
                "dist/index.js.map",
                "dist/internal/decrypt-transport-response-error.cjs",
                "dist/internal/decrypt-transport-response-error.cjs.map",
                "dist/internal/decrypt-transport-response-error.d.cts",
                "dist/internal/decrypt-transport-response-error.d.ts",
                "dist/internal/decrypt-transport-response-error.js",
                "dist/internal/decrypt-transport-response-error.js.map",
                "dist/kv/index.cjs",
                "dist/kv/index.cjs.map",
                "dist/kv/index.d.cts",
                "dist/kv/index.d.ts",
                "dist/kv/index.js",
                "dist/kv/index.js.map",
                "dist/kv/replication/contractConstants.cjs",
                "dist/kv/replication/contractConstants.cjs.map",
                "dist/kv/replication/contractConstants.d.cts",
                "dist/kv/replication/contractConstants.d.ts",
                "dist/kv/replication/contractConstants.js",
                "dist/kv/replication/contractConstants.js.map",
                "dist/kv/replication/grantPolicy.cjs",
                "dist/kv/replication/grantPolicy.cjs.map",
                "dist/kv/replication/grantPolicy.d.cts",
                "dist/kv/replication/grantPolicy.d.ts",
                "dist/kv/replication/grantPolicy.js",
                "dist/kv/replication/grantPolicy.js.map",
                "dist/kv/replication/grantPolicyConstants.cjs",
                "dist/kv/replication/grantPolicyConstants.cjs.map",
                "dist/kv/replication/grantPolicyConstants.d.cts",
                "dist/kv/replication/grantPolicyConstants.d.ts",
                "dist/kv/replication/grantPolicyConstants.js",
                "dist/kv/replication/grantPolicyConstants.js.map",
                "dist/kv/replication/grantPolicyTypes.cjs",
                "dist/kv/replication/grantPolicyTypes.cjs.map",
                "dist/kv/replication/grantPolicyTypes.d.cts",
                "dist/kv/replication/grantPolicyTypes.d.ts",
                "dist/kv/replication/grantPolicyTypes.js",
                "dist/kv/replication/grantPolicyTypes.js.map",
                "dist/kv/replication/index.cjs",
                "dist/kv/replication/index.cjs.map",
                "dist/kv/replication/index.d.cts",
                "dist/kv/replication/index.d.ts",
                "dist/kv/replication/index.js",
                "dist/kv/replication/index.js.map",
                "dist/kv/replication/prefix.cjs",
                "dist/kv/replication/prefix.cjs.map",
                "dist/kv/replication/prefix.d.cts",
                "dist/kv/replication/prefix.d.ts",
                "dist/kv/replication/prefix.js",
                "dist/kv/replication/prefix.js.map",
                "dist/scope-BZr0QwxX.d.ts",
                "dist/scope-DEgc9f-W.d.cts",
                "dist/sql/index.cjs",
                "dist/sql/index.cjs.map",
                "dist/sql/index.d.cts",
                "dist/sql/index.d.ts",
                "dist/sql/index.js",
                "dist/sql/index.js.map",
                "dist/telemetry/requestLog.cjs",
                "dist/telemetry/requestLog.cjs.map",
                "dist/telemetry/requestLog.d.cts",
                "dist/telemetry/requestLog.d.ts",
                "dist/telemetry/requestLog.js",
                "dist/telemetry/requestLog.js.map",
                "dist/types-Bf91gup6.d.ts",
                "dist/types-CSd0RYir.d.cts",
                "dist/types-CSd0RYir.d.ts",
                "dist/types-D4XbIfFJ.d.cts",
                "package.json",
              ],
            };
            // Only top-level generated declaration chunks may change their 8-character hash.
            // Keep duplicate normalized names: equality checks both membership and multiplicity.
            const entry = file => name === 'sdk-services'
              ? file.replace(/^(dist\/(?:BaseService|IHooksService|ISQLService|scope|types))-[A-Za-z0-9_-]{8}(\.d\.(?:ts|cts))$/, '$1-HASH$2')
              : file;
            assert.deepEqual(files.map(entry).sort(), publishedFiles[name].map(entry).sort(),
              `${name} packed file inventory differs from published stable`);
            const packed = file => fs.readFileSync(path.join(directory, 'package', file), 'utf8');
            if (name === 'cli') {
              const bundle = files.filter(file => /^dist\/.*\.(js|cjs)$/.test(file)).map(packed).join('\n');
              assert(bundle.includes('JSON.stringify(response)') && bundle.includes('process.stdout.write'));
              assert(bundle.includes('setInterval(') && bundle.includes('clearInterval(alive)'));
            } else {
              for (const extension of ['js', 'cjs', 'd.ts', 'd.cts']) {
                assert(files.includes(`dist/feed/index.${extension}`));
                assert(/\bonce\b/.test(packed(`dist/feed/index.${extension}`)));
              }
              function exportsExist(value) {
                if (typeof value === 'string') assert(files.includes(value.replace(/^\.\//, '')));
                else for (const entry of Object.values(value)) exportsExist(entry);
              }
              exportsExist(manifest(name).exports['./feed']);
              assert(/once[\s\S]*break|once[\s\S]*return/.test(packed('dist/feed/index.js')));
            }
          }
          async function verify(name) {
            assert(Object.hasOwn(targets, name));
            const doc = await document(name, `verified-${name}`);
            const published = doc.versions[targets[name].version];
            assert(published, `${name} publication not visible; inspect accepted write, do not republish`);
            assert.equal(published.version, targets[name].version);
            assert(!Object.hasOwn(published, 'gitHead'), 'unexpected gitHead: publication must use the saved tarball');
            assert.equal(published.dist.integrity, json(path.join(out, `${name}-pack.json`))[0].integrity);
            for (const kind of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
              assert.deepEqual(published[kind] || {}, manifest(name)[kind] || {});
            }
            assert.equal(doc['dist-tags'].latest, targets[name].version);
          }
          async function after() {
            const tags = await snapshot('after');
            const expected = json(path.join(out, 'before-tags.json'));
            for (const name of Object.keys(targets)) {
              if (selected(name)) expected[name].latest = targets[name].version;
            }
            assert.deepEqual(tags, expected, 'unexpected dist-tag change');
          }
          function filename(name) {
            assert(Object.hasOwn(targets, name));
            const saved = json(path.join(out, `${name}-pack.json`));
            assert(Array.isArray(saved) && saved.length === 1, 'expected exactly one saved pack');
            const info = saved[0];
            assert.equal(info.name, `@tinycloud/${name}`);
            assert.equal(info.version, targets[name].version);
            assert.equal(info.filename, `tinycloud-${name}-${targets[name].version}.tgz`);
            const integrity = 'sha512-' + createHash('sha512')
              .update(fs.readFileSync(path.join(out, info.filename))).digest('base64');
            assert.equal(info.integrity, integrity, 'saved tarball changed after validation');
            return info.filename;
          }
          function evidence() {
            const integrities = {};
            for (const name of Object.keys(targets)) {
              filename(name);
              integrities[`@tinycloud/${name}`] = json(path.join(out, `${name}-pack.json`))[0].integrity;
            }
            save('source-integrities.json', { source_sha: sha, integrities });
          }
          async function main() {
            const [mode, name] = process.argv.slice(2);
            if (mode === 'preflight') await preflight();
            else if (mode === 'pack') await pack(name);
            else if (mode === 'verify') await verify(name);
            else if (mode === 'after') await after();
            else if (mode === 'filename') console.log(filename(name));
            else if (mode === 'evidence') evidence();
            else throw new Error('unknown validation mode');
          }
          main().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
          node "$RUNNER_TEMP/hotfix-check.cjs" preflight

      - name: Pack and validate before any write
        shell: bash
        run: |
          set -euo pipefail
          # Pack both before any write, including recovery, to retain both source integrities.
          node "$RUNNER_TEMP/hotfix-check.cjs" pack sdk-services
          node "$RUNNER_TEMP/hotfix-check.cjs" pack cli
          node "$RUNNER_TEMP/hotfix-check.cjs" evidence
          if [ "$PACKAGE" = cli ]; then
            node "$RUNNER_TEMP/hotfix-check.cjs" verify sdk-services
          fi
          git diff --exit-code -- . ':!packages/cli/dist/index.js' ':!packages/cli/dist/index.js.map' \
            ':!packages/cli/dist/legacy-entry.js' ':!packages/cli/dist/legacy-entry.js.map'
          git diff --cached --exit-code

      - name: Publish only selected hotfix packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != true ]; then
            if [ "$PACKAGE" = both ] || [ "$PACKAGE" = sdk-services ]; then
              services_filename="$(node "$RUNNER_TEMP/hotfix-check.cjs" filename sdk-services)"
              npm publish "$RUNNER_TEMP/hotfix-pack/$services_filename" --access public --tag latest --ignore-scripts --registry=https://registry.npmjs.org
              node "$RUNNER_TEMP/hotfix-check.cjs" verify sdk-services
            fi
            if [ "$PACKAGE" = both ] || [ "$PACKAGE" = cli ]; then
              node "$RUNNER_TEMP/hotfix-check.cjs" verify sdk-services
              cli_filename="$(node "$RUNNER_TEMP/hotfix-check.cjs" filename cli)"
              npm publish "$RUNNER_TEMP/hotfix-pack/$cli_filename" --access public --tag latest --ignore-scripts --registry=https://registry.npmjs.org
              node "$RUNNER_TEMP/hotfix-check.cjs" verify cli
            fi
          fi

      - name: Verify final tag maps after attempted writes
        if: ${{ always() && !cancelled() && !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/hotfix-pack/before-tags.json" ]; then
            node "$RUNNER_TEMP/hotfix-check.cjs" after
          fi

      - name: Retain registry and pack evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-1.6.6-hotfix-evidence
          path: ${{ runner.temp }}/hotfix-pack/
          if-no-files-found: warn
