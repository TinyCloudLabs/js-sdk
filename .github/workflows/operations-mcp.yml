name: Operations and MCP conformance

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: operations-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Read Rust toolchain version
        id: rust-version
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore Rust/Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ github.workflow }}-${{ github.job }}-
      - run: bun install --frozen-lockfile
      - name: Build SDK runtime prerequisites
        run: |
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          # @tinycloud/replica's worker entry imports @tinycloud/web-sdk-wasm.
          bun run --cwd packages/sdk-rs build:wasm:web
          bun run --cwd packages/sdk-rs/packages/web build
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build
          bun run --cwd packages/node-sdk build
      # The scanners import the CLI command registry, whose `tc replica`
      # handlers import @tinycloud/replica.
      - name: Build operations and replica packages for source scanners
        run: |
          bun run --cwd packages/operations build
          bun run --cwd packages/replica build
      - name: Generate and scan authored coverage
        run: |
          bun run check:operations-mcp
          bun run check:operations-mcp-boundaries
      - name: Build operations, CLI, and MCP
        run: |
          bun run --cwd packages/courier build
          bun run --cwd packages/cli build
          bun run --cwd packages/mcp build
      - name: Run focused conformance and concurrency tests
        run: |
          bun test tests/operations-mcp-conformance/conformance.test.ts
          bun test packages/operations/src/legacy-cli-concurrency.test.ts
          bun test packages/cli/src/commands/auth.test.ts
          bun test packages/cli/src/auth/prepared-openkey.test.ts
          bun test packages/cli/src/auth/browser-auth.test.ts
          bun test packages/cli/src/commands/auth.portable-proof.test.ts
          bun test packages/cli/src/commands/auth-logout-gate.integration.test.ts
          bun test packages/cli/src/commands/auth-logout-history-guard.integration.test.ts
          bun test packages/cli/src/commands/auth-logout-account.integration.test.ts
          bun test packages/cli/src/commands/auth-logout-legacy.integration.test.ts
          bun test packages/cli/src/commands/auth-logout-marker.integration.test.ts
          bun test packages/cli/src/commands/auth-null-marker.integration.test.ts
          bun test packages/cli/src/commands/auth-prepared.integration.test.ts
          bun test packages/cli/src/commands/auth-revoke.integration.test.ts
          bun test packages/cli/src/commands/auth-signin-stamp.integration.test.ts
          bun test packages/cli/src/lib/logout-revocation.test.ts
          bun test packages/cli/src/lib/profile-replicas.test.ts
          bun test packages/cli/src/lib/profile-replicas.defer.test.ts
          bun test packages/cli/src/commands/secrets.test.ts
          bun test packages/cli/src/commands/secrets-owner-retry.test.ts
          bun test packages/cli/src/commands/expired-session.test.ts
          bun test packages/cli/src/commands/secrets-grant-replay.test.ts
          bun test packages/cli/src/commands/import-expiry-race.test.ts
          bun test packages/cli/src/lib/host.discovery.test.ts
          bun test packages/cli/src/commands/stored-grant-warnings.test.ts
          bun test packages/cli/src/commands/auth-grants.test.ts
          bun test packages/cli/src/commands/auth-import-signed.test.ts
          bun test packages/cli/src/lib/revoke-delegation.test.ts
          bun test packages/cli/src/commands/delegation.test.ts
          bun test packages/cli/src/commands/delegation-openkey-revoke.test.ts
          bun test packages/cli/src/commands/raw-decrypt-grant.test.ts
          bun test packages/cli/src/commands/secrets-put-classification.test.ts
          bun test packages/cli/src/output/errors.test.ts
          bun test packages/cli/src/commands/account.test.ts
          bun test packages/cli/src/commands/account-invocations.test.ts
          bun test packages/cli/src/lib/account-access.test.ts
          bun test packages/cli/src/lib/approval-notices.test.ts
          bun test packages/node-sdk/src/TinyCloudNode.accountRegistrySync.test.ts
          bun test packages/cli/src/commands/secrets-request.test.ts
          bun test packages/cli/src/lib/secrets-wait.test.ts
          bun test packages/cli/src/lib/probe-child.test.ts
          bun test packages/cli/src/lib/node-release.test.ts
          bun test packages/cli/src/lib/node-fetch.test.ts
          bun test packages/cli/src/commands/secrets-wait.test.ts
          bun test packages/cli/src/commands/kv-retry.test.ts
          bun test packages/cli/test/node-retry.node.test.ts
          bun test packages/mcp/src/results.test.ts packages/mcp/src/tools.test.ts packages/mcp/src/stdio.test.ts packages/mcp/src/http.test.ts packages/mcp/src/remote-store.test.ts packages/mcp/src/http.e2e.test.ts
          bun test packages/cli/src/commands/share.test.ts
          bun test packages/cli/src/commands/share-artifact.test.ts
          bun test packages/cli/src/commands/share.integration.test.ts
          bun test packages/cli/src/share/adapters.test.ts
          bun test packages/cli/src/share/bearer-revoke.test.ts
          bun test packages/cli/src/share/native-receive.test.ts
      - name: Run production private-key secrets regression in isolation
        run: bun test packages/cli/src/commands/secrets-private-key-production.test.ts
      - name: Run MCP CLI regression in isolation
        run: bun test packages/mcp/src/cli.test.ts
      - name: Run packed MCP CLI regression in isolation
        run: bun test packages/mcp/src/packed-cli.test.ts
      - name: Verify generated files and coverage ledger
        run: |
          bun run check:operations-mcp
          bun run --cwd packages/cli check:coverage
      - name: Verify node release pin against upstream
        run: bun run --cwd packages/cli check:node-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify packed Node 20 fixtures
        run: bun run check:operations-mcp-pack

      - name: Save Rust/Cargo cache
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
