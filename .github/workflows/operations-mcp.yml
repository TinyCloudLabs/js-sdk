name: Operations and MCP conformance

on:
  pull_request:
  push:
    branches: [master, feat/tc-apps-diagnostics]

concurrency:
  group: operations-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ github.ref == 'refs/heads/feat/tc-apps-diagnostics' && '22.23.2' || '20' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Read Rust toolchain version
        id: rust-version
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore Rust/Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ github.workflow }}-${{ github.job }}-
      - run: bun install --frozen-lockfile
      - name: Build SDK runtime prerequisites
        run: |
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          # @tinycloud/replica's worker entry imports @tinycloud/web-sdk-wasm.
          bun run --cwd packages/sdk-rs build:wasm:web
          bun run --cwd packages/sdk-rs/packages/web build
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build
          bun run --cwd packages/replica build
          bun run --cwd packages/node-sdk build
      # The scanners import the CLI command registry, whose `tc replica`
      # handlers import @tinycloud/replica.
      - name: Build operations for source scanners
        run: |
          bun run --cwd packages/operations build
      - name: Generate and scan authored coverage
        run: |
          bun run check:operations-mcp
          bun run check:operations-mcp-boundaries
      - name: Build operations, CLI, and MCP
        run: |
          bun run --cwd packages/courier build
          bun run --cwd packages/cli build
          bun run --cwd packages/mcp build
      - name: Run focused conformance and concurrency tests
        run: |
          bun test tests/operations-mcp-conformance/conformance.test.ts
          bun test packages/cli/src/commands/auth.test.ts
          bun test packages/cli/src/commands/auth.portable-proof.test.ts
          bun test packages/cli/src/commands/secrets.test.ts
          bun test packages/cli/src/commands/secrets-owner-retry.test.ts
          bun test packages/cli/src/commands/expired-session.test.ts
          bun test packages/cli/src/commands/secrets-grant-replay.test.ts
          bun test packages/cli/src/commands/import-expiry-race.test.ts
          bun test packages/cli/src/lib/host.discovery.test.ts
          bun test packages/cli/src/commands/stored-grant-warnings.test.ts
          bun test packages/cli/src/commands/auth-grants.test.ts
          bun test packages/cli/src/commands/auth-import-signed.test.ts
          bun test packages/cli/src/lib/revoke-delegation.test.ts
          bun test packages/cli/src/commands/delegation.test.ts
          bun test packages/cli/src/commands/delegation-openkey-revoke.test.ts
          bun test packages/cli/src/commands/raw-decrypt-grant.test.ts
          bun test packages/cli/src/commands/secrets-put-classification.test.ts
          bun test packages/cli/src/output/errors.test.ts
          bun test packages/cli/src/commands/secrets-request.test.ts
          bun test packages/cli/src/lib/secrets-wait.test.ts
          bun test packages/cli/src/lib/probe-child.test.ts
          bun test packages/cli/src/commands/secrets-wait.test.ts
      - name: Allow unprivileged user and PID namespaces (profile-lock tests)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Match the existing operations gate's mandatory namespace preflight.
          unshare --user --map-root-user --pid --fork --mount-proc --uts --net --kill-child=SIGKILL sh -c 'hostname abcdef012345 && echo 10 > /proc/sys/kernel/ns_last_pid'
          command -v python3 && command -v nsenter
      - name: Verify scoped diagnostics with synthetic state
        run: |
          export HOME="$(mktemp -d)"
          export TC_HOME="$HOME/state"
          trap 'rm -rf "$HOME"' EXIT
          bun run --cwd packages/operations test
          bun test packages/sdk-services/src/context.test.ts
          bun test packages/cli/test/diagnostics.e2e.test.ts
          bun test packages/cli/test/diagnostics-approval.e2e.test.ts
          bun test packages/cli/src/commands/kv.test.ts
          bun test packages/cli/src/commands/authorization-errors.test.ts
          bun test packages/cli/src/commands/auth-paste-exit.test.ts
          bun test packages/cli/src/lib/replication-registry.test.ts
      - name: Verify MCP diagnostics and business behavior in isolation
        working-directory: packages/mcp
        run: |
          export HOME="$(mktemp -d)"
          export TC_HOME="$HOME/state"
          trap 'rm -rf "$HOME"' EXIT
          bun scripts/test.ts
      - name: Run production private-key secrets regression in isolation
        run: bun test packages/cli/src/commands/secrets-private-key-production.test.ts
      - name: Verify generated files and coverage ledger
        run: |
          bun run check:operations-mcp
          bun run --cwd packages/cli check:coverage
      - name: Verify packed Node 20 fixtures
        if: github.ref != 'refs/heads/feat/tc-apps-diagnostics'
        run: bun run check:operations-mcp-pack

      - name: Pack and verify the exact tc-apps alpha
        if: github.ref == 'refs/heads/feat/tc-apps-diagnostics'
        env:
          ALPHA_GUIDANCE: ${{ runner.temp }}/tc-apps-alpha-guidance
          ALPHA_OUTPUT: ${{ runner.temp }}/tc-apps-alpha-artifact
        run: |
          node --input-type=module <<'NODE'
          import { readFile, mkdir, writeFile } from "node:fs/promises";
          import { dirname, join } from "node:path";
          const identity = JSON.parse(await readFile("scripts/tc-apps-alpha-guidance.json", "utf8"));
          for (const path of Object.keys(identity.files)) {
            const response = await fetch(`https://raw.githubusercontent.com/TinyCloudLabs/prompts/${identity.sourceCommit}/${path}`);
            if (!response.ok) throw new Error(`Pinned guidance ${path}: HTTP ${response.status}`);
            const destination = join(process.env.ALPHA_GUIDANCE, path);
            await mkdir(dirname(destination), { recursive: true, mode: 0o700 });
            await writeFile(destination, Buffer.from(await response.arrayBuffer()));
          }
          NODE
          node scripts/build-team-preview.mjs --source-sha "$GITHUB_SHA" \
            --output "$ALPHA_OUTPUT" --guidance "$ALPHA_GUIDANCE" \
            --guidance-identity scripts/tc-apps-alpha-guidance.json
          bun scripts/check-operations-mcp-pack.ts --alpha-tarball \
            "$ALPHA_OUTPUT/tinycloud-telemetry-preview-0.1.0-alpha.0.tgz"

      - name: Retain verified alpha bytes
        if: github.ref == 'refs/heads/feat/tc-apps-diagnostics'
        uses: actions/upload-artifact@v4
        with:
          name: tc-apps-alpha-${{ github.sha }}
          path: ${{ runner.temp }}/tc-apps-alpha-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Save Rust/Cargo cache
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}

  publish-alpha:
    if: github.ref == 'refs/heads/feat/tc-apps-diagnostics' && contains(github.event.head_commit.message, '[publish tc-apps alpha]')
    needs: conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: tc-apps-alpha-${{ github.sha }}
          path: alpha
      - name: Publish only the verified standalone alpha
        working-directory: alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::The existing NPM_TOKEN is unavailable to this feature-branch job. No package was published."; exit 1; }
          npm whoami --registry=https://registry.npmjs.org
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const artifact = JSON.parse(await readFile("artifact.json", "utf8"));
          const bytes = await readFile("tinycloud-telemetry-preview-0.1.0-alpha.0.tgz");
          if (artifact.name !== "@tinycloud/telemetry-preview" || artifact.version !== "0.1.0-alpha.0"
            || artifact.sha256 !== createHash("sha256").update(bytes).digest("hex")
            || artifact.integrity !== `sha512-${createHash("sha512").update(bytes).digest("base64")}`) throw new Error("Artifact identity mismatch");
          NODE
          npm publish tinycloud-telemetry-preview-0.1.0-alpha.0.tgz --tag alpha --access public --ignore-scripts --registry=https://registry.npmjs.org
          npm view @tinycloud/telemetry-preview@0.1.0-alpha.0 dist --json --registry=https://registry.npmjs.org > registry-dist.json
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const artifact = JSON.parse(await readFile("artifact.json", "utf8"));
          const dist = JSON.parse(await readFile("registry-dist.json", "utf8"));
          assert.equal(dist.integrity, artifact.integrity);
          console.log(JSON.stringify({ package: `${artifact.name}@${artifact.version}`, integrity: dist.integrity, tarball: dist.tarball }));
          NODE
      - name: Smoke the published exact version
        run: |
          mkdir "$RUNNER_TEMP/published-alpha"
          cd "$RUNNER_TEMP/published-alpha"
          npm install --ignore-scripts --no-audit --no-fund --save-exact @tinycloud/telemetry-preview@0.1.0-alpha.0 --registry=https://registry.npmjs.org
          node_modules/.bin/tc-apps-alpha --alpha-identity
          node_modules/.bin/tc-apps-alpha --version
          node_modules/.bin/tc-apps-alpha-mcp --help
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const identity = JSON.parse(await readFile("node_modules/@tinycloud/telemetry-preview/identity.json", "utf8"));
          assert.equal(identity.source.commit, process.env.GITHUB_SHA);
          assert.equal(identity.version, "0.1.0-alpha.0");
          NODE

  preview-image:
    if: github.ref == 'refs/heads/feat/tc-apps-diagnostics' && contains(github.event.head_commit.message, '[publish tc-apps alpha]')
    needs: conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tc-apps-alpha-${{ github.sha }}
          path: alpha
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke the same package in a separate preview image
        env:
          IMAGE: ghcr.io/tinycloudlabs/tc-apps-alpha:${{ github.sha }}
        run: |
          SHA256=$(node -p "JSON.parse(require('fs').readFileSync('alpha/artifact.json')).sha256")
          docker build --platform linux/amd64 -f packages/mcp/Dockerfile.preview \
            --build-arg ALPHA_TARBALL=tinycloud-telemetry-preview-0.1.0-alpha.0.tgz \
            --build-arg ALPHA_SHA256="$SHA256" -t "$IMAGE" alpha
          docker run --rm --memory=256m --cpus=1 "$IMAGE" \
            /opt/tinycloud-alpha/node_modules/.bin/tc-apps-alpha-mcp --alpha-identity
          docker run --rm -i --memory=256m --cpus=1 --entrypoint node "$IMAGE" --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { mkdtemp } from "node:fs/promises";
          import { join } from "node:path";
          import { DiagnosticStore, createDiagnosticRuntime, makeDiagnosticContext } from "./node_modules/@tinycloud/telemetry-preview/node_modules/@tinycloud/operations/dist/diagnostics.js";
          const root = join(await mkdtemp("/tmp/tc-alpha-image-"), "history");
          const store = new DiagnosticStore(root);
          assert.equal((await store.status()).enabled, false);
          await store.control("enable", { scope: "tc-apps" });
          for (const ordinal of [1, 2]) {
            const runtime = createDiagnosticRuntime({ root, source: "mcp_stdio" });
            const binding = await runtime.binding();
            assert(binding);
            assert(runtime.emit({ type: "operation.step", ordinal }, makeDiagnosticContext(binding, "mcp_stdio", { scope: "tc-apps" })));
            await runtime.close();
          }
          assert.deepEqual((await store.snapshot({ all: true })).events.map(event => event.ordinal), [1, 2]);
          await store.control("disable");
          await store.delete({ all: true }, { pause_after: true });
          assert.deepEqual((await store.snapshot({ all: true })).events, []);
          console.log("Same-package image native worker write/readback, reopen, disable and deletion passed.");
          NODE
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"
