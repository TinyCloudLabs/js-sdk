name: Operations and MCP conformance

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: operations-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The former single `conformance` job ran for ~22 minutes. It is split into
# parallel jobs that each build the same tree (.github/actions/conformance-setup)
# and run a disjoint part of the old step list:
#
#   conformance-core   Phala deploy env regression, scanners, share unit tests,
#                      focused conformance/concurrency tests, the three isolated
#                      regressions, generated-file/ledger/release-pin/pack checks.
#   conformance-unit   The CLI, bootstrap, server, MCP OAuth and tests/cli unit
#                      loop, sharded by file index across the matrix. Every file
#                      runs in exactly one shard.
#   conformance        Aggregate. Its name is the required status check on
#                      master, so it must keep this id; it fails unless every
#                      job above succeeded.
jobs:
  conformance-core:
    name: conformance-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/conformance-setup
      - name: Run MCP Phala deploy environment consumer regression
        run: |
          npm ci --prefix .github/deploy-tools --ignore-scripts --no-audit --no-fund
          PHALA_BIN="$GITHUB_WORKSPACE/.github/deploy-tools/node_modules/.bin/phala" \
            node .github/scripts/test-mcp-deploy-env.mjs
      - name: Run MCP image :latest tag regression
        run: node .github/scripts/test-mcp-image-latest.mjs
      - name: Generate and scan authored coverage
        run: |
          bun run check:operations-mcp
          bun run check:operations-mcp-boundaries
      # One bun process per file, found by glob so new files are picked up.
      # Fails on any failing file, on a file that reports `0 pass` with skips,
      # and on a file that runs past its per-file timeout.
      - name: Run share-envelope and share-sdk unit tests
        timeout-minutes: 10
        env:
          BUN_JSC_useConcurrentJIT: "0"
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/share-unit-tests.log"
          mapfile -t files < <(find packages/share-envelope/test packages/share-sdk/test -name '*.test.ts' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=share tests::no test files found"
            exit 1
          fi
          failed=()
          for file in "${files[@]}"; do
            echo "::group::$file"
            if ! timeout 120 bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test "./$file" 2>&1 | tee "$log"; then
              failed+=("$file")
              echo "::error title=share test failed::$file"
            elif grep -Eq '\b0 pass\b' "$log" && grep -Eq '\b[1-9][0-9]* skip\b' "$log"; then
              failed+=("$file (0 pass, all skipped)")
              echo "::error title=share test skipped entirely::$file"
            fi
            echo "::endgroup::"
          done
          echo "ran ${#files[@]} files, ${#failed[@]} failed"
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi
      - name: Run focused conformance and concurrency tests
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test tests/operations-mcp-conformance/conformance.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/operations/src/legacy-cli-concurrency.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/node-sdk/src/TinyCloudNode.accountRegistrySync.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/mcp/src/results.test.ts packages/mcp/src/tools.test.ts packages/mcp/src/stdio.test.ts packages/mcp/src/http.test.ts packages/mcp/src/remote-store.test.ts packages/mcp/src/http.e2e.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/commands/share.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/commands/share-email-unavailable.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/commands/share-addressed-unavailable.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/commands/share-receive-email-claim.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/commands/share-artifact.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/commands/share.integration.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/share/adapters.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/share/path-bound-plan-permissions.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/share/short-links.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/share/bearer-revoke.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/share/native-receive.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/commands/share-folder.test.ts
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/share/html-folder.test.ts
      - name: Run production private-key secrets regression in isolation
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/cli/src/commands/secrets-private-key-production.test.ts
      - name: Run MCP CLI regression in isolation
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/mcp/src/cli.test.ts
      - name: Run packed MCP CLI regression in isolation
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test packages/mcp/src/packed-cli.test.ts
      - name: Verify generated files and coverage ledger
        run: |
          bun run check:operations-mcp
          bun run --cwd packages/cli check:coverage
      # The release metadata, checksum file and archives of the pinned node version are cached under a
      # key made from the pin file, so a warm run makes no request to the node release downloads.
      - name: Restore node release cache
        id: node-release-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/node-release-cache
          key: node-release-${{ hashFiles('packages/cli/src/lib/node-release.json') }}
      - name: Verify node release pin against upstream
        run: bun run --cwd packages/cli check:node-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_RELEASE_CACHE_DIR: ${{ runner.temp }}/node-release-cache
      - name: Save node release cache
        if: steps.node-release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/node-release-cache
          key: node-release-${{ hashFiles('packages/cli/src/lib/node-release.json') }}
      - name: Verify packed Node 20 fixtures
        run: bun run check:operations-mcp-pack

      # Only this job saves the shared cache; conformance-unit jobs restore it.
      - name: Save Rust/Cargo cache
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ steps.setup.outputs.rust-version }}-${{ github.workflow }}-conformance-${{ hashFiles('Cargo.lock') }}

  conformance-unit:
    name: conformance-unit (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # SHARD_TOTAL below is strategy.job-total, so adding a shard here is
        # the only edit needed to change the split.
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/conformance-setup
      # One bun process per file, found by glob so new files are picked up.
      # Fails on a failing file, on a file that runs past its per-file timeout,
      # on a file with no passing test (all skipped, only todo, or empty), on an
      # empty file set, on a configured path that does not exist, and on an
      # excluded file that no longer exists.
      # Each shard holds every build these files import (node/web wasm runtime,
      # sdk-core, node-sdk, operations, replica, courier, CLI), so one loop
      # covers the CLI, bootstrap, server, mcp oauth and tests/cli files.
      # Sharding: the sorted, non-excluded files are numbered from 0 and shard
      # N runs the files whose number is N modulo the shard count, so every
      # file runs in exactly one shard. Every shard validates the whole
      # configuration (roots, single files, excluded files, empty file set).
      - name: Run CLI, bootstrap, server, MCP OAuth and tests/cli unit tests
        timeout-minutes: 30
        env:
          BUN_JSC_useConcurrentJIT: "0"
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          set -o pipefail
          if [ "$SHARD_INDEX" -lt 0 ] || [ "$SHARD_INDEX" -ge "$SHARD_TOTAL" ]; then
            echo "::error title=unit tests::shard $SHARD_INDEX is outside 0..$((SHARD_TOTAL - 1))"
            exit 1
          fi
          log="$RUNNER_TEMP/remaining-unit-tests.log"
          roots=(packages/cli/src packages/cli/test packages/bootstrap/src packages/server/src tests/cli)
          single_files=(packages/mcp/src/oauth.test.ts packages/mcp/src/token-status.test.ts)
          declare -A excluded=(
            # Live-node suites, each run by a node lane:
            [packages/cli/src/commands/agent-grant-openkey.e2e.test.ts]="needs a live node; run by node-replication-e2e.yml"
            [packages/cli/src/commands/knowledge.e2e.test.ts]="needs a live node; run by node-replication-e2e.yml"
            [packages/cli/src/commands/onboard.expired.e2e.test.ts]="needs a live node; run by node-replication-e2e.yml; TC-2323"
            [packages/cli/src/commands/onboard.e2e.test.ts]="needs a live node; run by node-replication-e2e.yml"
            [packages/cli/src/commands/onboard.timeout.e2e.test.ts]="needs a live node; run by node-replication-e2e.yml; TC-2299"
            [packages/cli/src/commands/agent-grant.timeout.e2e.test.ts]="needs a live node; run by node-replication-e2e.yml; TC-2299"
            [packages/cli/src/commands/delegation-revoke-lookup.e2e.test.ts]="needs a live node; run by replica-e2e.yml"
            [packages/cli/src/commands/share-history-revoke.e2e.test.ts]="needs a live node; run by replica-e2e.yml"
            [packages/cli/test/replica.e2e.test.ts]="needs a live node; run by replica-e2e.yml"
            [packages/cli/test/replication-flag.e2e.test.ts]="needs a live node; run by replica-e2e.yml"
            [packages/cli/test/secrets-wait.e2e.test.ts]="needs a live node; run by replica-e2e.yml"
            [packages/cli/test/replica-secrets.e2e.test.ts]="needs a live node; run by replica-e2e.yml; TC-1899"
            [tests/cli/kv/kv.test.ts]="needs a live node; run by replica-e2e.yml; TC-1902"
            [tests/cli/sql/sql.test.ts]="needs a live node; run by replica-e2e.yml; TC-1902"
            [tests/cli/secrets/secrets-e2e.test.ts]="needs a live node; run by replica-e2e.yml; TC-1902"
            # Run in their own step in conformance-core:
            [packages/cli/src/commands/secrets-private-key-production.test.ts]="run in isolation by its own step"
            # Known failures, tracked:
            [packages/cli/src/config/shared-state-writers.test.ts]="fails on master: test-support harness writes shared state directly; TC-1898"
            [tests/cli/duckdb/duckdb.test.ts]="needs a DuckDB-enabled node; the node binary the live-node lanes use is built without DuckDB; TC-1965"
          )
          failed=()
          for root in "${roots[@]}"; do
            if [ ! -d "$root" ]; then
              echo "::error title=unit tests::configured test directory does not exist: $root"
              failed+=("$root (directory does not exist)")
            fi
          done
          for file in "${single_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error title=unit tests::configured test file does not exist: $file"
              failed+=("$file (file does not exist)")
            fi
          done
          existing_roots=()
          for root in "${roots[@]}"; do [ -d "$root" ] && existing_roots+=("$root"); done
          files=()
          if [ "${#existing_roots[@]}" -gt 0 ]; then
            mapfile -t files < <(find "${existing_roots[@]}" -name '*.test.*' -not -path '*/node_modules/*' -not -path '*/dist/*' | sort)
          fi
          for file in "${single_files[@]}"; do [ -f "$file" ] && files+=("$file"); done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=unit tests::no test files found"
            exit 1
          fi
          for file in "${!excluded[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error title=unit tests::excluded file does not exist: $file"
              failed+=("$file (excluded file does not exist)")
            fi
          done
          ran=0
          position=0
          for file in "${files[@]}"; do
            if [ -n "${excluded[$file]+set}" ]; then
              echo "EXCLUDED: $file: ${excluded[$file]}"
              continue
            fi
            this_position=$position
            position=$((position + 1))
            if [ $((this_position % SHARD_TOTAL)) -ne "$SHARD_INDEX" ]; then
              continue
            fi
            ran=$((ran + 1))
            echo "::group::$file"
            if ! timeout 120 bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun test "./$file" 2>&1 | tee "$log"; then
              failed+=("$file (failed, or ran past 120s)")
              echo "::error title=unit test failed::$file"
            elif ! grep -Eq '^ *[1-9][0-9]* pass' "$log"; then
              if grep -Eq '^ *[1-9][0-9]* skip' "$log"; then reason="0 pass, all skipped"
              elif grep -Eq '^ *[1-9][0-9]* todo' "$log"; then reason="0 pass, only todo"
              else reason="0 pass, empty"; fi
              failed+=("$file ($reason)")
              echo "::error title=unit test ran nothing::$file ($reason)"
            fi
            echo "::endgroup::"
          done
          echo "shard $SHARD_INDEX/$SHARD_TOTAL: ran $ran of $position files, ${#excluded[@]} excluded, ${#failed[@]} failed"
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi

  # Required status check "conformance". Runs even when a split job failed,
  # was cancelled or was skipped, and fails in every case but full success, so
  # a missing or skipped job can never turn the required check green.
  conformance:
    name: conformance
    if: always()
    needs: [conformance-core, conformance-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every conformance job to succeed
        env:
          CORE_RESULT: ${{ needs.conformance-core.result }}
          UNIT_RESULT: ${{ needs.conformance-unit.result }}
        run: |
          echo "conformance-core: $CORE_RESULT"
          echo "conformance-unit: $UNIT_RESULT"
          if [ "$CORE_RESULT" != "success" ] || [ "$UNIT_RESULT" != "success" ]; then
            echo "::error title=conformance::a conformance job did not succeed"
            exit 1
          fi
