name: TC-192 I1 TypeScript gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  i1-types:
    name: I1 operations strict TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Bun 1.2.0's concurrent JIT intermittently corrupts WASM execution (bad
      # signatures, out-of-bounds access) in the SDK verifier; about 8 of 400
      # processes fail with it on, 0 with it off, and 0 on newer Bun.
      BUN_JSC_useConcurrentJIT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.0

      # The profile-lock tests run the built package under Node (as the CLI
      # runs it) in children whose hard links are made to fail.
      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Restore Rust/Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Verify pinned Bun runtime
        run: test "$(bun --version)" = "1.2.0"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # The invocation test imports the sdk-core public policy export, so
      # emit its current runtime and declaration artifacts before testing it.
      - name: Build SDK package exports
        run: |
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build

      - name: Build WASM runtime dependencies
        run: |
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          # @tinycloud/replica's worker entry imports @tinycloud/web-sdk-wasm;
          # its build needs the web WASM artifacts too.
          bun run --cwd packages/sdk-rs build:wasm:web
          bun run --cwd packages/sdk-rs/packages/web build

      # Operations typechecking imports the node SDK public types.
      - name: Build Node SDK package exports
        run: bun run --cwd packages/node-sdk build

      - name: Typecheck the complete operations program
        run: bun run typecheck:operations

      - name: Assert complete operations typecheck inputs
        run: bun run --cwd packages/operations check:typecheck-inputs

      - name: Allow unprivileged user and PID namespaces (profile-lock tests)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Exactly PREFLIGHT in packages/operations/src/profile-lock-namespaces.test.ts,
          # which throws under CI if this fails or python3/nsenter are missing.
          unshare --user --map-root-user --pid --fork --mount-proc --uts --net --kill-child=SIGKILL sh -c 'hostname abcdef012345 && echo 10 > /proc/sys/kernel/ns_last_pid'
          command -v python3 && command -v nsenter

      # The operations tests spawn the CLI from source (auth-import lock
      # contention), which imports @tinycloud/replica.
      - name: Build, test, and verify the operations catalog
        run: |
          bun run --cwd packages/operations build
          bun run --cwd packages/replica build
          bash "$GITHUB_WORKSPACE/.github/scripts/run-private-tests.sh" bun run --cwd packages/operations test
          bun run --cwd packages/operations check:generated

      - name: Save Rust/Cargo cache
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
