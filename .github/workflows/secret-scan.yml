# Secret scan (pre-release security check). Runs on every pull request and
# every push to master, with no `paths:` filter, so it can be a required check.
#
# Pull request: scans only the PR's own commits (base..head). A finding fails
# the job; the fix is to remove the secret from the branch history and, if it
# was ever live, rotate it. The baseline (`.gitleaksignore`) and config
# (`.gitleaks.toml`) come from the BASE commit, so a PR cannot exempt its own
# finding. A real new baseline entry lands in its own baseline-only PR,
# reviewed by security; that PR's own scan fails by design.
# Push to master: scans the whole history against master's `.gitleaksignore`,
# the reviewed baseline of findings that are test fixtures or placeholders. A
# new fingerprint on master fails the job.
# Both modes ignore inline `gitleaks:allow` comments (none in history as of
# 2026-11-22 besides this workflow's own documentation).
#
# Add a fingerprint to `.gitleaksignore` only after a security review shows the
# value is not a live secret.
name: Secret scan

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install gitleaks
        uses: ./.github/actions/install-gitleaks

      # Baseline and config from the base commit, never from the PR head.
      # gitleaks also reads `.gitleaksignore` (and, without --config,
      # `.gitleaks.toml`) from the scanned checkout, so the head's copies are
      # removed from the working tree first; the scan reads history, not the tree.
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks-base"
          mkdir -p "$dir"
          git show "${BASE_SHA}:.gitleaksignore" > "$dir/.gitleaksignore" 2>/dev/null || : > "$dir/.gitleaksignore"
          if ! git show "${BASE_SHA}:.gitleaks.toml" > "$dir/gitleaks.toml" 2>/dev/null; then
            printf '[extend]\nuseDefault = true\n' > "$dir/gitleaks.toml"
          fi
          rm -f .gitleaksignore .gitleaks.toml
          gitleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --config "$dir/gitleaks.toml" \
            --gitleaks-ignore-path "$dir/.gitleaksignore" \
            --ignore-gitleaks-allow \
            --redact --exit-code 1 --no-banner .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Scan the whole history against the baseline
        if: github.event_name != 'pull_request'
        run: gitleaks git --ignore-gitleaks-allow --redact --exit-code 1 --no-banner .
