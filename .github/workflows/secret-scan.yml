# Secret scan (pre-release security check). Runs on every pull request and
# every push to master, with no `paths:` filter, so it can be a required check.
#
# Pull request: scans only the PR's own commits (base..head). A finding fails
# the job; the fix is to remove the secret from the branch history and, if it
# was ever live, rotate it.
# Push to master: scans the whole history against `.gitleaksignore`, the
# reviewed baseline of findings that are test fixtures or placeholders. A new
# fingerprint on master fails the job.
#
# The PR range scan reads `.gitleaksignore` too. Add a fingerprint there only
# after a security review shows the value is not a live secret.
name: Secret scan

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install gitleaks
        uses: ./.github/actions/install-gitleaks

      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        run: gitleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --exit-code 1 --no-banner .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Scan the whole history against the baseline
        if: github.event_name != 'pull_request'
        run: gitleaks git --redact --exit-code 1 --no-banner .
