name: TC-2113 bun crash bisect

# Throwaway experiment workflow. Never merge.
on:
  pull_request:

env:
  MASTER_SHA: 98b27a8731798bc3af3a56df1a54a1212f1ab74a
  HEAD_SHA: fa88f760cc56820ee1d2e60a1eac427a07489406

jobs:
  build:
    name: build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [master, head]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant == 'master' && '98b27a8731798bc3af3a56df1a54a1212f1ab74a' || 'fa88f760cc56820ee1d2e60a1eac427a07489406' }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - name: Restore Rust/Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.99.0-Replica e2e-replica-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-1.99.0-Replica e2e-replica-e2e-
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: bun install --frozen-lockfile
      - name: Build
        run: |
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          bun run --cwd packages/sdk-rs build:wasm:web
          bun run --cwd packages/sdk-rs/packages/web build
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build
          bun run --cwd packages/node-sdk build
          bun run --cwd packages/operations build
          bun run --cwd packages/replica build
          bun run --cwd packages/courier build
          bun run --cwd packages/cli build
          bun run --cwd packages/web-sdk build
          bun run --cwd packages/web-sdk build:coordinationos-vendor
      - name: Pack workspace
        run: |
          cd "$GITHUB_WORKSPACE/.."
          tar --exclude="$(basename "$GITHUB_WORKSPACE")/target" -czf "$RUNNER_TEMP/ws.tgz" "$(basename "$GITHUB_WORKSPACE")"
          ls -la "$RUNNER_TEMP/ws.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: ws-${{ matrix.variant }}
          path: ${{ runner.temp }}/ws.tgz
          compression-level: 0
          retention-days: 2

  test:
    name: ${{ matrix.exp }} #${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        exp: [e5-head-alone, e8-master-pair, e1-master-full, e2-head-full, e3-head-pair, e4a-head-no-runtimesigner, e4b-head-no-openkeysigning, e4c-head-no-askLog, e4d-head-no-modallist, e4e-head-no-new-tests, e6-head-full-bun144, e7-head-split-decrypt]
        include:
          - { exp: e5-head-alone, variant: head, bun: 1.3.14, mode: alone, remove: "" }
          - { exp: e8-master-pair, variant: master, bun: 1.3.14, mode: pair, remove: "" }
          - { exp: e1-master-full, variant: master, bun: 1.3.14, mode: full, remove: "" }
          - { exp: e2-head-full, variant: head, bun: 1.3.14, mode: full, remove: "" }
          - { exp: e3-head-pair, variant: head, bun: 1.3.14, mode: pair, remove: "" }
          - { exp: e4a-head-no-runtimesigner, variant: head, bun: 1.3.14, mode: full, remove: "packages/web-sdk/tests/tcwRuntimePermissionSigner.test.ts" }
          - { exp: e4b-head-no-openkeysigning, variant: head, bun: 1.3.14, mode: full, remove: "packages/web-sdk/tests/tcwRequestPermissionsOpenKeySigning.test.ts" }
          - { exp: e4c-head-no-askLog, variant: head, bun: 1.3.14, mode: full, remove: "packages/web-sdk/tests/ui/panel-permission-ask-log.test.ts" }
          - { exp: e4d-head-no-modallist, variant: head, bun: 1.3.14, mode: full, remove: "packages/web-sdk/tests/PermissionRequestModalDelegationList.test.ts" }
          - { exp: e4e-head-no-new-tests, variant: head, bun: 1.3.14, mode: full, remove: "packages/web-sdk/tests/tcwRuntimePermissionSigner.test.ts packages/web-sdk/tests/tcwRequestPermissionsOpenKeySigning.test.ts packages/web-sdk/tests/ui/panel-permission-ask-log.test.ts packages/web-sdk/tests/PermissionRequestModalDelegationList.test.ts" }
          - { exp: e6-head-full-bun144, variant: head, bun: 1.4.4, mode: full, remove: "" }
          - { exp: e7-head-split-decrypt, variant: head, bun: 1.3.14, mode: split, remove: "" }
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@v4
        with:
          name: ws-${{ matrix.variant }}
          path: ${{ runner.temp }}/art
      - name: Unpack
        run: |
          cd "$GITHUB_WORKSPACE/.."
          tar -xzf "$RUNNER_TEMP/art/ws.tgz"
      - name: Experiment
        env:
          OPENCREDENTIALS_FIXTURE_OPTIONAL: "1"
          ITER: "20"
          EXP: ${{ matrix.exp }}
          MODE: ${{ matrix.mode }}
          REMOVE: ${{ matrix.remove }}
          SHARD: ${{ matrix.shard }}
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          echo "bun $(bun --version) revision $(bun --revision)"
          echo "cpu: $(grep -m1 'model name' /proc/cpuinfo) avx512f_lines=$(grep -c avx512f /proc/cpuinfo)"
          for f in $REMOVE; do rm -f "$f"; done
          mkdir -p "$RUNNER_TEMP/logs"
          DEC=packages/web-sdk/tests/tcwRequestPermissionsDecryptExpiry.test.ts
          crashes=0
          fails=0
          run_once() { # label, args...
            local label="$1"; shift
            local log="$RUNNER_TEMP/logs/$EXP-$SHARD-$label.log"
            bun test --parallel=1 "$@" --reporter=junit --reporter-outfile="$RUNNER_TEMP/$label.xml" > "$log" 2>&1
            local rc=$?
            local class=ok
            if [ "$rc" -ge 128 ] || grep -Eq 'panic\(|Segmentation fault|oh no: Bun has crashed' "$log"; then class=CRASH; elif [ "$rc" -ne 0 ]; then class=testfail; fi
            echo "RESULT exp=$EXP shard=$SHARD run=$label rc=$rc class=$class bun=$(bun --version)"
            if [ "$class" = CRASH ]; then
              grep -E 'bun\.report|panic\(|Segmentation|##\[group\]' "$log" | tail -6
            fi
            [ "$class" = CRASH ] && return 2
            [ "$class" = testfail ] && return 1
            return 0
          }
          for i in $(seq 1 "$ITER"); do
            case "$MODE" in
              full)
                run_once "i$i" packages/web-sdk/tests; r=$?
                ;;
              alone)
                run_once "i$i" ./$DEC; r=$?
                ;;
              pair)
                run_once "i$i" ./packages/web-sdk/tests/tcw-spaceId.test.js ./$DEC; r=$?
                ;;
              split)
                run_once "i$i-alone" ./$DEC; ra=$?
                mv "$DEC" "$RUNNER_TEMP/dec.bak"
                run_once "i$i-rest" packages/web-sdk/tests; rb=$?
                mv "$RUNNER_TEMP/dec.bak" "$DEC"
                r=0; [ "$ra" = 2 ] || [ "$rb" = 2 ] && r=2
                [ "$r" = 0 ] && { [ "$ra" = 1 ] || [ "$rb" = 1 ]; } && r=1
                ;;
            esac
            [ "$r" = 2 ] && crashes=$((crashes+1))
            [ "$r" = 1 ] && fails=$((fails+1))
          done
          echo "SUMMARY exp=$EXP shard=$SHARD iterations=$ITER crashes=$crashes testfails=$fails"
          echo "SUMMARY exp=$EXP shard=$SHARD iterations=$ITER crashes=$crashes testfails=$fails" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.exp }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/logs/*.log
          retention-days: 2
          if-no-files-found: ignore
