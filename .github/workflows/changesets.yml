name: Release

# Stable-only releases from master (no pre mode, no beta cycle).
#
# A push to master versions and publishes ONLY the packages listed in
# .github/release-scope.json, as plain stable versions on the `latest` dist-tag.
# Every other workspace package keeps its version, CHANGELOG and pending
# changesets until a maintainer adds it to that file. The file's `enabled`
# switch is the only thing that lets THIS workflow release anything: while it is
# false a push to master does nothing. The break-glass raw-publish.yml and
# manual-release.yml were retired (TC-4123); the only off-master path is the
# SHA-bound courier-stable-stage.yml route (staging tag only). See
# scripts/scoped-version.mjs.
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      resume:
        description: 'Type "release" to finish publishing the newest release version commit when a release stopped partway; nothing new is versioned'
        required: false

# One queue for every job, and never cancel a run once it starts (TC-1095).
# Release runs push to the same master and publish the same npm packages, so
# they must not overlap. A cancelled run used to leave npm versions behind that
# the next version commit reused.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Reads the switch in .github/release-scope.json from the pushed commit. Nothing else
  # runs (no install, no key, no npm token) unless it is true.
  gate:
    name: Release gate
    if: github.repository == 'TinyCloudLabs/js-sdk' && github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Read the release switch
        id: gate
        run: |
          node .github/scripts/scoped-version.mjs check
          node .github/scripts/scoped-version.mjs gate "$GITHUB_OUTPUT"

  # On push to master: version and publish the in-scope packages' pending changesets.
  release:
    name: Release
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # actions: read lets pre-publish read earlier Release runs' logs (TC-1457).
    # contents: read is all this job needs. github-releases holds
    # contents: write and creates the GitHub Releases (O25).
    permissions:
      actions: read
      contents: read
      # id-token: write lets npm sign a provenance attestation for what this job publishes (see publishConfig.provenance in packages/courier/package.json).
      id-token: write
    outputs:
      published: ${{ steps.published.outputs.published }}
      release-sha: ${{ steps.release.outputs.sha }}
    steps:
      # The deploy key is not left in git config or ~/.ssh for install and
      # build steps; only the push step below uses it.
      # Keep these display names (and their Post names) for the exact step
      # inventory used by the cancelled-release provenance check.
      - name: Run actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run oven-sh/setup-bun@v1
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: '1.3.14'
          no-cache: true

      - name: Run dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: '1.100.0'
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack
        with:
          rust-version: '1.100.0'

      # The checkout's lockfile is used as committed; only the versioning step below may change it (TC-1155).
      - run: bun install --frozen-lockfile

      # Changesets that name at least one package in the release scope. Changesets for
      # packages outside it stay pending and are not counted.
      - name: Check for pending changesets
        id: check
        run: node .github/scripts/scoped-version.mjs pending "$GITHUB_OUTPUT"

      # Fail before versioning if the deploy key is missing (no fallback to
      # GH_TOKEN for the push).
      - name: Install release deploy key
        if: steps.check.outputs.pending != '0'
        run: .github/scripts/release-deploy-key.sh install
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # Majors are a human decision (TC-615): a pending major changeset publishes
      # only after a maintainer's `approve-major-release:` sign-off commit.
      - name: Require sign-off for major bumps
        if: steps.check.outputs.pending != '0'
        run: node .github/scripts/check-major-release-signoff.mjs release

      - name: List the release scope and pending changesets
        if: steps.check.outputs.pending != '0'
        run: |
          echo "## Release scope:"
          cat .github/release-scope.json
          echo ""
          echo "## Pending changesets:"
          find .changeset -name '*.md' ! -name 'README.md' -exec basename {} \; | sort

      # A release that pushed but did not finish publishing leaves versions npm
      # lacks (TC-1095). Stop before versioning anything: finish it with the
      # `resume: release` dispatch. This also stops a scoped release whose
      # already-staged baseline versions are not on npm yet, so a version set
      # aside for another source is never published from this one.
      - name: Refuse to run while a release is unfinished
        if: steps.check.outputs.pending != '0'
        run: node .github/scripts/check-npm-release-provenance.mjs unpublished-stable

      # Versions only the packages in the release scope and refuses the result unless the
      # bumps are stable, same-major increases that match the locked inventory (when set).
      - name: Version and build
        if: steps.check.outputs.pending != '0'
        run: |
          node .github/scripts/scoped-version.mjs version
          # After a version bump Bun can need a second install to settle workspace dependency
          # specs; commit a lockfile that a later install leaves unchanged (TC-1155).
          for pass in 1 2 3; do
            cp bun.lock "$RUNNER_TEMP/bun.lock.before"
            bun install
            cmp -s bun.lock "$RUNNER_TEMP/bun.lock.before" && break
            if [ "$pass" = 3 ]; then echo "::error::bun.lock still changes after 3 installs"; exit 1; fi
          done
          bun run build:release
        env:
          BUILD_SETUP_ENABLED: true
          NODE_OPTIONS: --max-old-space-size=6144

      # The pins embedded in the CLI must still match the upstream node release
      # before this version is committed and published.
      - name: Verify node release pin
        if: steps.check.outputs.pending != '0'
        run: bun run --cwd packages/cli check:node-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A published package must not pin another workspace package to a version
      # this release replaces (TC-2014). Runs before the version commit is pushed.
      - name: Check internal dependency pins
        if: steps.check.outputs.pending != '0'
        run: node scripts/check-internal-dep-pins.mjs

      # Commit the version bump locally; nothing leaves the runner until the
      # npm check below has passed (TC-1457). The push still comes before any
      # publish (TC-1095).
      - name: Commit release version bumps
        id: release
        if: steps.check.outputs.pending != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: release stable packages [skip ci]"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node for npm publish
        if: steps.check.outputs.pending != '0'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # `changeset publish` silently skips versions npm already has. Fail
      # instead when npm's copy of a current version was published before the
      # commit that set it, or when an earlier run got npm to accept a version
      # npm does not show yet (TC-1457). It judges only the packages this commit
      # versioned (RELEASE_SCOPE_FILE). This runs before the push, so a stop
      # leaves master and the pending changesets untouched.
      - name: Check npm before publishing
        if: steps.check.outputs.pending != '0'
        run: node .github/scripts/check-npm-release-provenance.mjs pre-publish
        env:
          # Read-only: lets the check see whether an earlier Release run already got npm to accept a version (TC-1457).
          GH_TOKEN: ${{ github.token }}
          # Records each package's dist-tags before publishing, for post-publish's "tag back" commands.
          RELEASE_DIST_TAGS_FILE: ${{ runner.temp }}/npm-dist-tags.json
          RELEASE_SCOPE_FILE: .github/release-scope.json

      # Push the version commit before publishing anything (TC-1095). If the
      # push fails because master moved, stop: nothing is published, and the
      # queued run for the newer master versions these changesets instead.
      - name: Push release version bumps
        if: steps.check.outputs.pending != '0'
        run: |
          if [ "$COMMITTED" = true ]; then
            if ! git push git@github.com:TinyCloudLabs/js-sdk.git master; then
              echo "::error title=Version commit not pushed::Could not push to master (it has probably moved past ${GITHUB_SHA}). Nothing was published; the run for the newer commit releases these changesets."
              exit 1
            fi
          fi
          # Pushed (or nothing to push): the key has no further use in this job.
          rm -rf "$RUNNER_TEMP/release-ssh"
        env:
          COMMITTED: ${{ steps.release.outputs.committed }}
          GIT_SSH_COMMAND: ssh -F /dev/null -i ${{ runner.temp }}/release-ssh/id -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${{ runner.temp }}/release-ssh/known_hosts -o GlobalKnownHostsFile=/dev/null

      - name: Publish stable to npm
        if: steps.check.outputs.pending != '0'
        run: |
          # Publish only from the version commit that is on master.
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ] || [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Not the pushed version commit::Refusing to publish: the checkout is not a clean copy of ${RELEASE_SHA}."
            git status --short
            exit 1
          fi
          # Resolve workspace:* to real versions before publishing.
          # Belt-and-suspenders: changeset publish also resolves internally,
          # but keeping this script ensures consistency with the prior workflow.
          # This edits package.json files after the version commit, so the
          # tree is dirty from here on; nothing commits these edits.
          node -e '
            const fs = require("fs");
            const glob = require("child_process").execSync("find packages -name package.json -not -path */node_modules/*", {encoding:"utf8"}).trim().split("\n");
            const versions = {};
            for (const f of glob) {
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              if (pkg.name) versions[pkg.name] = pkg.version;
            }
            for (const f of glob) {
              const raw = fs.readFileSync(f, "utf8");
              const pkg = JSON.parse(raw);
              let changed = false;
              for (const depType of ["dependencies","devDependencies","peerDependencies"]) {
                if (!pkg[depType]) continue;
                for (const [name, ver] of Object.entries(pkg[depType])) {
                  if (typeof ver === "string" && ver.startsWith("workspace:")) {
                    if (versions[name]) { pkg[depType][name] = versions[name]; changed = true; }
                  }
                }
              }
              if (changed) { fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + "\n"); console.log("Resolved workspace refs in", f); }
            }
          '
          # Publish in dependency order (publish-in-dependency-order.mjs): one
          # `changeset publish` per layer of the in-scope packages, and npm must
          # serve every tarball of a layer (HTTP 200) before the next layer
          # starts. RELEASE_SCOPE_FILE hides every package outside the release
          # scope and every version this commit did not set, so nothing else
          # can be published from this checkout. Outside pre mode the versions
          # go to the `latest` dist-tag.
          # Keep the output: npm can accept a version and show it hours later
          # (web-sdk, TC-1457). The accepted versions are recorded in this
          # run's log, which the next run's pre-publish reads, so a version
          # that is accepted but not yet visible is never published again.
          # The announce log is the publish log minus any version whose tarball
          # never appeared; only it feeds the GitHub Releases.
          set +e
          node .github/scripts/publish-in-dependency-order.mjs "$RUNNER_TEMP/changeset-publish.log" "$RUNNER_TEMP/announce/changeset-publish.log"
          status=$?
          set -e
          node .github/scripts/check-npm-release-provenance.mjs record-accepted "$RUNNER_TEMP/changeset-publish.log"
          exit "$status"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_SCOPE_FILE: .github/release-scope.json

      # Records whether this run published versions. It runs even
      # when publish failed partway, so versions npm accepted still get releases.
      - name: Record whether this run published versions
        id: published
        if: always() && steps.check.outputs.pending != '0'
        run: |
          COUNT=$(node .github/scripts/github-releases.mjs count "$RUNNER_TEMP/announce/changeset-publish.log")
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # The log is kept one day for github-releases, which runs in a
      # separate job so that only it holds contents: write.
      - name: Keep the publish log for github-releases
        if: always() && steps.published.outputs.published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-publish-log
          path: ${{ runner.temp }}/announce/changeset-publish.log
          retention-days: 1
          if-no-files-found: error

      # Fails red when a published version requires an internal version npm
      # does not show (even one npm accepted), and prints the commands that move
      # its dist-tag back and forward. It never moves a dist-tag itself.
      # Then fails red when a CLI version this run published is not marked
      # _hasShrinkwrap by npm: the CLI's prepack writes the npm-shrinkwrap.json
      # that pins its runtime tree into the published tarball
      # (packages/cli/scripts/release-shrinkwrap.mjs, TC-4276), and a prepack
      # that did not run would publish it unpinned. Same step, so the attempt
      # shapes in check-npm-release-provenance.mjs stay as they are.
      - name: Confirm npm has every released version
        if: steps.check.outputs.pending != '0'
        run: |
          node .github/scripts/check-npm-release-provenance.mjs post-publish "$RUNNER_TEMP/changeset-publish.log"
          node packages/cli/scripts/release-shrinkwrap.mjs published "$RUNNER_TEMP/changeset-publish.log"
        env:
          RELEASE_DIST_TAGS_FILE: ${{ runner.temp }}/npm-dist-tags.json
          RELEASE_SCOPE_FILE: .github/release-scope.json

      - name: Remove release deploy key
        if: always()
        run: .github/scripts/release-deploy-key.sh remove

  # Manual trigger (`resume: release`): finish a release that stopped after its
  # version commit was pushed (npm slow to show a version, a failed layer). A
  # release run versions and pushes before it publishes, so the next push run
  # finds no pending changesets and publishes nothing; this job publishes the
  # missing versions from that release commit instead. Nothing is versioned or
  # pushed, so it needs no deploy key and no contents: write. Idempotent:
  # `changeset publish` skips versions npm already has, and the pre-publish
  # check stops on a version an earlier run got npm to accept but npm does not
  # show yet.
  release-resume:
    name: Release resume
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.resume == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.published.outputs.published }}
      release-sha: ${{ steps.unfinished.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: false

      # The version commit may predate these scripts (the layered publisher, its
      # wait): keep master's copy and run every release script from it.
      - name: Keep the release scripts
        run: cp -R .github/scripts "$RUNNER_TEMP/release-scripts"

      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: '1.3.14'
          no-cache: true

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: '1.100.0'
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack
        with:
          rust-version: '1.100.0'

      # Keep the checkout clean before selecting a previously pushed release.
      - run: bun install --frozen-lockfile

      # All the missing versions must come from one release commit; the step fails otherwise,
      # and when npm has everything there is nothing to do (no commit selected).
      - name: Find the unfinished release
        id: unfinished
        run: node "$RUNNER_TEMP/release-scripts/check-npm-release-provenance.mjs" unfinished-stable "$GITHUB_OUTPUT"

      # A major bump in the commit needs the sign-off its changeset was merged with
      # (or one in the commit itself), exactly as in a push release.
      - name: Check the major sign-off of the unfinished release
        if: steps.unfinished.outputs.sha != ''
        run: node "$RUNNER_TEMP/release-scripts/check-major-release-signoff.mjs" pr "${RELEASE_SHA}^1" "$RELEASE_SHA"
        env:
          RELEASE_SHA: ${{ steps.unfinished.outputs.sha }}

      - name: Check out the unfinished release
        if: steps.unfinished.outputs.sha != ''
        run: git checkout --quiet --detach "$RELEASE_SHA"
        env:
          RELEASE_SHA: ${{ steps.unfinished.outputs.sha }}

      # Recovery publishes the existing commit, including its committed lockfile.
      - name: Install the release's dependencies
        if: steps.unfinished.outputs.sha != ''
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.unfinished.outputs.sha != ''
        run: bun run build:release
        env:
          BUILD_SETUP_ENABLED: true
          NODE_OPTIONS: --max-old-space-size=6144

      # The version commit carries the build outputs of the tracked dist folders
      # (`git add .` after the build). Publish exactly that, not a fresh rebuild.
      - name: Restore the committed build outputs
        if: steps.unfinished.outputs.sha != ''
        run: git ls-files -m -z -- ':(glob)**/dist/**' | xargs -0 -r git checkout --

      - name: Verify node release pin
        if: steps.unfinished.outputs.sha != ''
        run: bun run --cwd packages/cli check:node-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check internal dependency pins
        if: steps.unfinished.outputs.sha != ''
        run: node scripts/check-internal-dep-pins.mjs

      - name: Setup Node for npm publish
        if: steps.unfinished.outputs.sha != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm before publishing
        if: steps.unfinished.outputs.sha != ''
        run: node "$RUNNER_TEMP/release-scripts/check-npm-release-provenance.mjs" pre-publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIST_TAGS_FILE: ${{ runner.temp }}/npm-dist-tags.json
          RELEASE_SCOPE_FILE: .github/release-scope.json

      - name: Publish stable to npm
        if: steps.unfinished.outputs.sha != ''
        run: |
          # Publish only from the unfinished version commit, as built above.
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ] || [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Not the version commit::Refusing to publish: the checkout is not a clean copy of ${RELEASE_SHA}."
            git status --short
            exit 1
          fi
          # Resolve workspace:* to real versions before publishing, as the release job does.
          node -e '
            const fs = require("fs");
            const glob = require("child_process").execSync("find packages -name package.json -not -path */node_modules/*", {encoding:"utf8"}).trim().split("\n");
            const versions = {};
            for (const f of glob) {
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              if (pkg.name) versions[pkg.name] = pkg.version;
            }
            for (const f of glob) {
              const raw = fs.readFileSync(f, "utf8");
              const pkg = JSON.parse(raw);
              let changed = false;
              for (const depType of ["dependencies","devDependencies","peerDependencies"]) {
                if (!pkg[depType]) continue;
                for (const [name, ver] of Object.entries(pkg[depType])) {
                  if (typeof ver === "string" && ver.startsWith("workspace:")) {
                    if (versions[name]) { pkg[depType][name] = versions[name]; changed = true; }
                  }
                }
              }
              if (changed) { fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + "\n"); console.log("Resolved workspace refs in", f); }
            }
          '
          # Layered publish (publish-in-dependency-order.mjs): versions npm already shows are skipped,
          # the rest go out one dependency layer at a time, each waiting for npm to serve it.
          set +e
          node "$RUNNER_TEMP/release-scripts/publish-in-dependency-order.mjs" "$RUNNER_TEMP/changeset-publish.log" "$RUNNER_TEMP/announce/changeset-publish.log"
          status=$?
          set -e
          node "$RUNNER_TEMP/release-scripts/check-npm-release-provenance.mjs" record-accepted "$RUNNER_TEMP/changeset-publish.log"
          exit "$status"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_SHA: ${{ steps.unfinished.outputs.sha }}
          RELEASE_SCOPE_FILE: .github/release-scope.json

      - name: Record whether this run published versions
        id: published
        if: always() && steps.unfinished.outputs.sha != ''
        run: |
          COUNT=$(node "$RUNNER_TEMP/release-scripts/github-releases.mjs" count "$RUNNER_TEMP/announce/changeset-publish.log")
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the publish log for github-releases
        if: always() && steps.published.outputs.published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-publish-log
          path: ${{ runner.temp }}/announce/changeset-publish.log
          retention-days: 1
          if-no-files-found: error

      # As in the release job; a release commit from before the CLI's shrinkwrap has no script and is not checked for it.
      - name: Confirm npm has every released version
        if: steps.unfinished.outputs.sha != ''
        run: |
          node "$RUNNER_TEMP/release-scripts/check-npm-release-provenance.mjs" post-publish "$RUNNER_TEMP/changeset-publish.log"
          if [ -f packages/cli/scripts/release-shrinkwrap.mjs ]; then
            node packages/cli/scripts/release-shrinkwrap.mjs published "$RUNNER_TEMP/changeset-publish.log"
          fi
        env:
          RELEASE_DIST_TAGS_FILE: ${{ runner.temp }}/npm-dist-tags.json
          RELEASE_SCOPE_FILE: .github/release-scope.json

  # Creates the GitHub Releases for what the release jobs published (O25). Only
  # this job holds contents: write, and it installs no dependencies.
  github-releases:
    name: GitHub Releases
    needs: [release, release-resume]
    if: always() && (needs.release.outputs.published == 'true' || needs.release-resume.outputs.published == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checked out at the version commit the release job published, so the
      # CHANGELOG sections match the published versions. That commit's copy of
      # the script is the one the release job ran.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.release-sha || needs.release-resume.outputs.release-sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-publish-log
          path: ${{ runner.temp }}/release-publish

      # A failure is reported as an error annotation. npm already has the
      # versions, so this job does not fail.
      - name: Create GitHub Releases for published versions
        run: node .github/scripts/github-releases.mjs create "$RUNNER_TEMP/release-publish/changeset-publish.log" "$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.release.outputs.release-sha || needs.release-resume.outputs.release-sha }}
