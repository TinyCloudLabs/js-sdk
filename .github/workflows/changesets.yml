name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to graduate the current betas to stable'
        required: true

# One queue for both jobs, and never cancel a run once it starts (TC-1095).
# Beta and stable runs push to the same master and publish the same npm
# packages, so they must not overlap. A cancelled run used to leave npm
# versions behind that the next version commit reused.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # On push to master: publish incrementing beta pre-releases
  beta:
    name: Beta Release
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    # actions: read lets pre-publish read earlier Release runs' logs (TC-1457).
    # contents: read is all this job needs. beta-github-releases holds
    # contents: write and creates the GitHub Releases (O25).
    # id-token: write lets npm sign provenance for packages that ask for it
    # (`publishConfig.provenance`, e.g. @tinycloud/cli): the GitHub OIDC token
    # proves which workflow and commit built the tarball.
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.published.outputs.published }}
      release-sha: ${{ steps.release.outputs.sha }}
    steps:
      # The deploy key is not left in git config or ~/.ssh for install and
      # build steps; only the push step below uses it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          no-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # The checkout's lockfile is used as committed; only the versioning step below may change it (TC-1155).
      - run: bun install --frozen-lockfile

      - name: Check for pending changesets
        id: check
        run: |
          COUNT=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l)
          echo "pending=$COUNT" >> "$GITHUB_OUTPUT"

      # Fail before versioning if the deploy key is missing (no fallback to
      # GH_TOKEN for the push).
      - name: Install release deploy key
        if: steps.check.outputs.pending != '0'
        run: .github/scripts/release-deploy-key.sh install
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # Majors are a human decision (TC-615): a new major changeset publishes
      # only after a maintainer's `approve-major-release:` sign-off commit.
      - name: Require sign-off for major bumps
        if: steps.check.outputs.pending != '0'
        run: node .github/scripts/check-major-release-signoff.mjs beta

      - name: List pending changesets
        if: steps.check.outputs.pending != '0'
        run: |
          echo "## Pending changesets to consume:"
          find .changeset -name '*.md' ! -name 'README.md' -exec basename {} \; | sort
          echo ""
          echo "## Current pre.json state:"
          cat .changeset/pre.json

      # A stable release that pushed but did not finish publishing leaves
      # stable versions npm lacks. In pre mode `changeset publish` would tag
      # them `beta`, and versioning could bump past them, so stop before
      # versioning anything (TC-1095). Packages npm has never seen are new and
      # are left to beta versioning.
      - name: Refuse to run while a stable release is unfinished
        if: steps.check.outputs.pending != '0'
        run: node .github/scripts/check-npm-release-provenance.mjs unpublished-stable

      - name: Version and build
        if: steps.check.outputs.pending != '0'
        run: |
          bun changeset version
          # After a version bump bun 1.4 can need a second install to settle workspace dependency
          # specs; commit a lockfile that a later install leaves unchanged (TC-1155).
          for pass in 1 2 3; do
            cp bun.lock "$RUNNER_TEMP/bun.lock.before"
            bun install
            cmp -s bun.lock "$RUNNER_TEMP/bun.lock.before" && break
            if [ "$pass" = 3 ]; then echo "::error::bun.lock still changes after 3 installs"; exit 1; fi
          done
          bun run build:release
        env:
          BUILD_SETUP_ENABLED: true

      # The pins embedded in the CLI must still match the upstream node release
      # before this version is committed and published.
      - name: Verify node release pin
        if: steps.check.outputs.pending != '0'
        run: bun run --cwd packages/cli check:node-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A published package must not pin another workspace package to a version
      # this release replaces (TC-2014). Runs before the version commit is pushed.
      - name: Check internal dependency pins
        if: steps.check.outputs.pending != '0'
        run: node scripts/check-internal-dep-pins.mjs

      # Commit the version bump locally; nothing leaves the runner until the
      # npm check below has passed (TC-1457). The push still comes before any
      # publish (TC-1095).
      - name: Commit beta version bumps
        id: release
        if: steps.check.outputs.pending != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: beta version packages [skip ci]"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node for npm publish
        if: steps.check.outputs.pending != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # `changeset publish` silently skips versions npm already has. Fail
      # instead when npm's copy of a current version was published before the
      # commit that set it, or when an earlier run got npm to accept a version
      # npm does not show yet (TC-1457). This runs before the push, so a stop
      # leaves master and the pending changesets untouched.
      - name: Check npm before publishing
        if: steps.check.outputs.pending != '0'
        run: node .github/scripts/check-npm-release-provenance.mjs pre-publish
        env:
          # Read-only: lets the check see whether an earlier Release run already got npm to accept a version (TC-1457).
          GH_TOKEN: ${{ github.token }}
          # Records each package's dist-tags before publishing, for post-publish's "tag back" commands.
          RELEASE_DIST_TAGS_FILE: ${{ runner.temp }}/npm-dist-tags.json

      # Push the version commit before publishing anything (TC-1095). If the
      # push fails because master moved, stop: nothing is published, and the
      # queued run for the newer master versions these changesets instead.
      - name: Push beta version bumps
        if: steps.check.outputs.pending != '0'
        run: |
          if [ "$COMMITTED" = true ]; then
            if ! git push git@github.com:TinyCloudLabs/js-sdk.git master; then
              echo "::error title=Version commit not pushed::Could not push to master (it has probably moved past ${GITHUB_SHA}). Nothing was published; the run for the newer commit releases these changesets."
              exit 1
            fi
          fi
          # Pushed (or nothing to push): the key has no further use in this job.
          rm -rf "$RUNNER_TEMP/release-ssh"
        env:
          COMMITTED: ${{ steps.release.outputs.committed }}
          GIT_SSH_COMMAND: ssh -F /dev/null -i ${{ runner.temp }}/release-ssh/id -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${{ runner.temp }}/release-ssh/known_hosts -o GlobalKnownHostsFile=/dev/null

      - name: Publish beta to npm
        if: steps.check.outputs.pending != '0'
        run: |
          # Publish only from the version commit that is on master.
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ] || [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Not the pushed version commit::Refusing to publish: the checkout is not a clean copy of ${RELEASE_SHA}."
            git status --short
            exit 1
          fi
          # Resolve workspace:* to real versions before publishing.
          # Belt-and-suspenders: changeset publish also resolves internally,
          # but keeping this script ensures consistency with the prior workflow.
          # This edits package.json files after the version commit, so the
          # tree is dirty from here on; nothing commits these edits.
          node -e '
            const fs = require("fs");
            const glob = require("child_process").execSync("find packages -name package.json -not -path */node_modules/*", {encoding:"utf8"}).trim().split("\n");
            const versions = {};
            for (const f of glob) {
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              if (pkg.name) versions[pkg.name] = pkg.version;
            }
            for (const f of glob) {
              const raw = fs.readFileSync(f, "utf8");
              const pkg = JSON.parse(raw);
              let changed = false;
              for (const depType of ["dependencies","devDependencies","peerDependencies"]) {
                if (!pkg[depType]) continue;
                for (const [name, ver] of Object.entries(pkg[depType])) {
                  if (typeof ver === "string" && ver.startsWith("workspace:")) {
                    if (versions[name]) { pkg[depType][name] = versions[name]; changed = true; }
                  }
                }
              }
              if (changed) { fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + "\n"); console.log("Resolved workspace refs in", f); }
            }
          '
          # Use `changeset publish` instead of a hand-rolled loop so that
          # already-published versions are skipped gracefully. The hand-rolled
          # loop 403'd on sdk-core@2.1.0-beta.0 in the 2026-04-10 release after
          # PR #182, aborting before the wasm packages (which actually needed
          # publishing) were attempted. The check above fails the run instead
          # when a version npm already has was published before its version
          # commit.
          # Keep the output: npm can accept a version and show it hours later
          # (web-sdk, TC-1457). The accepted versions are recorded in this
          # run's log, which the next run's pre-publish reads, so a version
          # that is accepted but not yet visible is never published again.
          set +e
          bunx changeset publish 2>&1 | tee "$RUNNER_TEMP/changeset-publish.log"
          status=${PIPESTATUS[0]}
          set -e
          node .github/scripts/check-npm-release-provenance.mjs record-accepted "$RUNNER_TEMP/changeset-publish.log"
          exit "$status"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}

      # Records whether this run's publish reported any versions. It runs even
      # when publish failed partway, so versions npm accepted still get releases.
      - name: Record whether this run published versions
        id: published
        if: always() && steps.check.outputs.pending != '0'
        run: |
          COUNT=$(node .github/scripts/github-releases.mjs count "$RUNNER_TEMP/changeset-publish.log")
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # The log is kept one day for beta-github-releases, which runs in a
      # separate job so that only it holds contents: write.
      - name: Keep the publish log for beta-github-releases
        if: always() && steps.published.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beta-publish-log
          path: ${{ runner.temp }}/changeset-publish.log
          retention-days: 1
          if-no-files-found: error

      # Fails red when a published version requires an internal version npm
      # does not show (even one npm accepted), and prints the commands that move
      # its dist-tag back and forward. It never moves a dist-tag itself.
      - name: Confirm npm has every current version
        if: steps.check.outputs.pending != '0'
        run: node .github/scripts/check-npm-release-provenance.mjs post-publish "$RUNNER_TEMP/changeset-publish.log"
        env:
          RELEASE_DIST_TAGS_FILE: ${{ runner.temp }}/npm-dist-tags.json

      - name: Remove release deploy key
        if: always()
        run: .github/scripts/release-deploy-key.sh remove

  # Creates the GitHub Releases for what the beta job published (O25). Only
  # this job holds contents: write, and it installs no dependencies.
  beta-github-releases:
    name: Beta GitHub Releases
    needs: beta
    if: always() && needs.beta.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checked out at the version commit the beta job published, so the
      # CHANGELOG sections match the published versions. That commit's copy of
      # the script is the one the beta job ran.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.beta.outputs.release-sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          name: beta-publish-log
          path: ${{ runner.temp }}/beta-publish

      # A failure is reported as an error annotation. npm already has the
      # versions, so this job does not fail.
      - name: Create GitHub Releases for published versions
        run: node .github/scripts/github-releases.mjs create "$RUNNER_TEMP/beta-publish/changeset-publish.log" "$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.beta.outputs.release-sha }}

  # Manual trigger: graduate betas to stable release
  stable:
    name: Stable Release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'release'
    runs-on: ubuntu-latest
    # id-token: write: npm provenance, as in the beta job.
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      # The deploy key is not left in git config or ~/.ssh for install and
      # build steps; only the push step below uses it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: false

      # Recovery runs check out an older release commit that may predate this
      # script, so keep a copy from master for the release step.
      - name: Keep the GitHub release script
        run: cp .github/scripts/github-releases.mjs "$RUNNER_TEMP/github-releases.mjs"

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          no-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Keep the checkout clean before selecting a previously pushed release.
      - run: bun install --frozen-lockfile

      # Finish an unfinished stable release before versioning anything new
      # (TC-1095). If a previous stable run pushed its release commit but npm
      # lacks some of its versions, this run checks out that commit and
      # publishes exactly those versions from it; nothing new graduates. The
      # step fails if the missing versions do not come from one release commit.
      - name: Find an unfinished stable release
        id: unfinished
        run: node .github/scripts/check-npm-release-provenance.mjs unfinished-stable "$GITHUB_OUTPUT"

      # Fail before versioning if the deploy key is missing (no fallback to
      # GH_TOKEN for the push). Recovery runs do not push and need no key.
      - name: Install release deploy key
        if: steps.unfinished.outputs.sha == ''
        run: .github/scripts/release-deploy-key.sh install
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Check out the unfinished stable release
        if: steps.unfinished.outputs.sha != ''
        run: git checkout --quiet --detach "$RELEASE_SHA"
        env:
          RELEASE_SHA: ${{ steps.unfinished.outputs.sha }}

      # A package that would graduate at a higher major than it entered pre
      # mode needs a maintainer's `approve-major-release:` sign-off (TC-615).
      - name: Require sign-off for major releases
        if: steps.unfinished.outputs.sha == ''
        run: node .github/scripts/check-major-release-signoff.mjs stable

      - name: Exit pre mode and version
        if: steps.unfinished.outputs.sha == ''
        run: |
          bun changeset pre exit
          bun changeset version

      - name: Normalize unversioned private workspaces
        if: steps.unfinished.outputs.sha == ''
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');

          const files = execFileSync('find', [
            'apps', 'packages', 'tests', '-name', 'package.json',
            '-not', '-path', '*/node_modules/*'
          ], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);

          for (const file of files) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!pkg.private || pkg.version !== null) continue;

            delete pkg.version;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');

            const changelog = path.join(path.dirname(file), 'CHANGELOG.md');
            if (fs.existsSync(changelog)) {
              const expected = `# ${pkg.name}\n\n## null`;
              const actual = fs.readFileSync(changelog, 'utf8').trim();
              if (actual !== expected) {
                throw new Error(`Refusing to remove non-generated changelog: ${changelog}`);
              }
              fs.unlinkSync(changelog);
            }

            console.log(`Restored unversioned private workspace: ${pkg.name}`);
          }
          NODE

      # Same lockfile settling as the beta job (TC-1155): the release commit must carry a lockfile
      # that a later install leaves unchanged.
      - name: Install newly versioned dependencies
        if: steps.unfinished.outputs.sha == ''
        run: |
          for pass in 1 2 3; do
            cp bun.lock "$RUNNER_TEMP/bun.lock.before"
            bun install
            cmp -s bun.lock "$RUNNER_TEMP/bun.lock.before" && break
            if [ "$pass" = 3 ]; then echo "::error::bun.lock still changes after 3 installs"; exit 1; fi
          done

      # Recovery publishes the existing commit, including its original lockfile.
      - name: Install unfinished release dependencies
        if: steps.unfinished.outputs.sha != ''
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:release
        env:
          BUILD_SETUP_ENABLED: true

      - name: Verify node release pin
        run: bun run --cwd packages/cli check:node-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A published package must not pin another workspace package to a version
      # this release replaces (TC-2014). Recovery runs publish an older commit
      # that may not have the script, and were checked when they were cut.
      - name: Check internal dependency pins
        if: steps.unfinished.outputs.sha == ''
        run: node scripts/check-internal-dep-pins.mjs

      # Push before publishing anything (TC-1095). One push carries two
      # commits: the stable release, then pre mode re-entered for the next
      # beta cycle, so master is never left outside pre mode. Publish from the
      # first commit: in pre mode `changeset publish` would use the beta
      # dist-tag. If the push fails, nothing is published; dispatch again.
      # If the publish fails after the push, dispatch again: the next run
      # finishes this release first, and the beta job refuses to run until then.
      - name: Commit and push stable release
        if: steps.unfinished.outputs.sha == ''
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: release stable packages [skip ci]"
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          bun changeset pre enter beta
          git add .
          git commit -m "chore: enter beta pre-release mode [skip ci]"
          if ! git push git@github.com:TinyCloudLabs/js-sdk.git master; then
            echo "::error title=Stable release not pushed::Could not push to master (it has probably moved). Nothing was published; dispatch the stable release again."
            exit 1
          fi
          # Pushed: the key has no further use in this job.
          rm -rf "$RUNNER_TEMP/release-ssh"
          git checkout --quiet --detach "$RELEASE_SHA"
        env:
          GIT_SSH_COMMAND: ssh -F /dev/null -i ${{ runner.temp }}/release-ssh/id -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${{ runner.temp }}/release-ssh/known_hosts -o GlobalKnownHostsFile=/dev/null

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # `changeset publish` silently skips versions npm already has. Fail
      # instead when npm's copy of a current version was published before the
      # commit that set it. Recovery runs execute the script from the release
      # commit being finished, which may predate the accepted-version record
      # (TC-1457); only beta runs record it, so stable publishing is unchanged.
      - name: Check npm before publishing
        run: node .github/scripts/check-npm-release-provenance.mjs pre-publish
        env:
          # Read-only: lets the check see whether an earlier Release run already got npm to accept a version (TC-1457).
          GH_TOKEN: ${{ github.token }}
          # Records each package's dist-tags before publishing, for post-publish's "tag back" commands.
          RELEASE_DIST_TAGS_FILE: ${{ runner.temp }}/npm-dist-tags.json

      - name: Publish stable to npm
        run: |
          # Publish only from the stable release commit that is on master.
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ] || [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Not the pushed release commit::Refusing to publish: the checkout is not a clean copy of ${RELEASE_SHA}."
            git status --short
            exit 1
          fi
          # Resolve workspace:* to real versions before publishing.
          # Belt-and-suspenders: changeset publish also resolves internally,
          # but keeping this script ensures consistency with the prior workflow.
          # This edits package.json files after the release commit, so the
          # tree is dirty from here on; nothing commits these edits.
          node -e '
            const fs = require("fs");
            const glob = require("child_process").execSync("find packages -name package.json -not -path */node_modules/*", {encoding:"utf8"}).trim().split("\n");
            const versions = {};
            for (const f of glob) {
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              if (pkg.name) versions[pkg.name] = pkg.version;
            }
            for (const f of glob) {
              const raw = fs.readFileSync(f, "utf8");
              const pkg = JSON.parse(raw);
              let changed = false;
              for (const depType of ["dependencies","devDependencies","peerDependencies"]) {
                if (!pkg[depType]) continue;
                for (const [name, ver] of Object.entries(pkg[depType])) {
                  if (typeof ver === "string" && ver.startsWith("workspace:")) {
                    if (versions[name]) { pkg[depType][name] = versions[name]; changed = true; }
                  }
                }
              }
              if (changed) { fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + "\n"); console.log("Resolved workspace refs in", f); }
            }
          '
          # Use `changeset publish` instead of a hand-rolled loop so that
          # already-published versions are skipped gracefully, matching the
          # beta job's behavior.
          # Keep the output for the GitHub release step (O25).
          set +e
          bunx changeset publish 2>&1 | tee "$RUNNER_TEMP/changeset-publish.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha || steps.unfinished.outputs.sha }}

      # One GitHub Release per package version this run published (O25). A
      # failure is reported as an error annotation; npm already has the
      # versions, so the job does not fail.
      - name: Create GitHub Releases for published versions
        run: node "$RUNNER_TEMP/github-releases.mjs" create "$RUNNER_TEMP/changeset-publish.log" "$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.sha || steps.unfinished.outputs.sha }}

      - name: Confirm npm has every current version
        run: node .github/scripts/check-npm-release-provenance.mjs post-publish
        env:
          RELEASE_DIST_TAGS_FILE: ${{ runner.temp }}/npm-dist-tags.json

      # Tag the commit that was published, not master's tip: a recovery run
      # publishes an older release commit while master has moved on.
      - name: Create GitHub Release
        run: |
          VERSION=$(node -e "console.log(require('./packages/web-sdk/package.json').version)")
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists; package-only release is complete."
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --generate-notes \
              --target "$RELEASE_SHA"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha || steps.unfinished.outputs.sha }}

      - name: Remove release deploy key
        if: always()
        # Inline, not the checked-out script: recovery runs check out a release
        # commit that may predate the script.
        run: rm -rf "$RUNNER_TEMP/release-ssh"
