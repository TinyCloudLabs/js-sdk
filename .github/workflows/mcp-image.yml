name: Publish hosted MCP image
run-name: Hosted MCP ${{ inputs.preflight_only && 'credentials preflight' || format('{0}{1}', inputs.package_version, inputs.image_digest) }}

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Published @tinycloud/mcp version to build and deploy (leave empty when image_digest is set)
        required: false
        type: string
      image_digest:
        description: Redeploy an existing ghcr.io/tinycloudlabs/tinycloud-mcp image by digest (sha256:...) without building, for rollback
        required: false
        type: string
      preflight_only:
        description: Only check the deploy credentials (Phala can read CVM tinycloud-mcp and it runs a permitted OS image; the Cloudflare token is active and can read the mcp.tinycloud.xyz records). Builds and deploys nothing.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  # Production dstack OS the tinycloud-mcp CVM must run (the Phala KMS only releases app keys to this image).
  PHALA_OS_IMAGE: dstack-0.5.12
  PHALA_OS_IMAGE_HASH: 8db40cb23008d6213668b5816702d100b37b859a8a5bfd18d938ae3a1b3715bd

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pick.outputs.image }}
      build: ${{ steps.pick.outputs.build }}
      deploy: ${{ steps.pick.outputs.deploy }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - name: Pick the image to deploy
        id: pick
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: |
          if [ "$PREFLIGHT_ONLY" = "true" ]; then
            if [ -n "$PACKAGE_VERSION$IMAGE_DIGEST" ]; then
              echo "::error::preflight_only checks credentials only; leave package_version and image_digest empty"
              exit 1
            fi
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          if [ -n "$PACKAGE_VERSION" ] && [ -n "$IMAGE_DIGEST" ]; then
            echo "::error::Set package_version or image_digest, not both"
            exit 1
          fi
          if [ -n "$IMAGE_DIGEST" ]; then
            if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::image_digest must be sha256: followed by 64 lowercase hex characters"
              exit 1
            fi
            echo "image=ghcr.io/tinycloudlabs/tinycloud-mcp@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$PACKAGE_VERSION" ]; then
            if ! [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::package_version must be a published version such as 0.5.0-beta.7"
              exit 1
            fi
            echo "image=ghcr.io/tinycloudlabs/tinycloud-mcp:$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
            echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set package_version to build and deploy, or image_digest to redeploy an existing image"
            exit 1
          fi
  preflight:
    # Credentials check before any build or deploy: a stale key must stop the run before anything changes.
    runs-on: ubuntu-latest
    # Read the production secrets without creating a deployment record; the token only reads this repo's guard script.
    environment:
      name: production
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Install Phala CLI
        run: npm install --global phala@1.1.22
      - name: Phala can read CVM tinycloud-mcp
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        shell: bash
        run: |
          test -n "$PHALA_CLOUD_API_KEY" || { echo "::error::PHALA_CLOUD_API_KEY is not set"; exit 1; }
          if ! cvm=$(phala cvms get tinycloud-mcp --api-token "$PHALA_CLOUD_API_KEY" --json); then
            # With --json the CLI writes its error object to stdout.
            reason=$(jq -r '"\(.error // .message // "unknown error") (HTTP \(.http_status // .status // "n/a"))"' <<<"$cvm" 2>/dev/null || echo "unparsed CLI error")
            echo "::error::Phala could not read CVM tinycloud-mcp with PHALA_CLOUD_API_KEY: $reason"
            exit 1
          fi
          echo "Phala: CVM tinycloud-mcp readable; status=$(jq -r '.status // .cvm_status // "unknown"' <<<"$cvm")"
      # Fail closed before any build or deploy unless the CVM runs the pinned production OS, or the one pinned dev OS
      # in .github/scripts/phala-dev-os-allowlist.txt after a fresh integrity check (.github/scripts/phala-os-guard.sh).
      # To fix it, set the OS by hand: `phala api -X PATCH /cvms/<id>/os-image -F os_image_name=dstack-0.5.12`.
      - name: Test the OS image guard
        run: bash .github/scripts/test-phala-os-guard.sh
      - name: CVM tinycloud-mcp runs a permitted OS image
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        shell: bash
        run: |
          if ! cvm=$(phala cvms get tinycloud-mcp --api-token "$PHALA_CLOUD_API_KEY" --json); then
            echo "::error::Phala could not read the OS image of CVM tinycloud-mcp"
            exit 1
          fi
          bash .github/scripts/phala-os-guard.sh <<<"$cvm"
      - name: Cloudflare token is active and can read the mcp.tinycloud.xyz records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          cf() { curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          zone=$(cf "/zones?name=tinycloud.xyz")
          zone_id=$(jq -r 'if .success then (.result[0].id // empty) else empty end' <<<"$zone")
          account_id=$(jq -r 'if .success then (.result[0].account.id // empty) else empty end' <<<"$zone")
          [ -n "$zone_id" ] || { echo "::error::CLOUDFLARE_API_TOKEN cannot read zone tinycloud.xyz (invalid token or no zone access)"; exit 1; }
          # User tokens verify at /user/tokens/verify; account-owned tokens at /accounts/{id}/tokens/verify.
          verify=$(cf "/user/tokens/verify")
          if ! jq -e '.success == true' <<<"$verify" >/dev/null; then verify=$(cf "/accounts/$account_id/tokens/verify"); fi
          status=$(jq -r 'if .success then (.result.status // "unknown") else "unrecognized" end' <<<"$verify")
          [ "$status" = "active" ] || { echo "::error::Cloudflare token-verify reports $status"; exit 1; }
          records=$(cf "/zones/$zone_id/dns_records?name=mcp.tinycloud.xyz")
          jq -e '.success == true' <<<"$records" >/dev/null || { echo "::error::CLOUDFLARE_API_TOKEN cannot read the mcp.tinycloud.xyz DNS records"; exit 1; }
          echo "Cloudflare: token-verify active; zone tinycloud.xyz and $(jq -r '.result | length' <<<"$records") mcp.tinycloud.xyz record(s) readable"
  image:
    needs: [resolve, preflight]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: packages/mcp
          push: true
          cache-from: type=gha,scope=mcp-image
          cache-to: ${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && 'type=gha,mode=max,scope=mcp-image' || '' }}
          build-args: TINYCLOUD_MCP_VERSION=${{ needs.resolve.outputs.version }}
          tags: |
            ghcr.io/tinycloudlabs/tinycloud-mcp:${{ needs.resolve.outputs.version }}
            ghcr.io/tinycloudlabs/tinycloud-mcp:latest
  deploy:
    needs: [resolve, preflight, image]
    # A digest redeploy skips the image job; deploy after a successful build or that skip only.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.deploy == 'true' && needs.preflight.result == 'success' && (needs.image.result == 'success' || (needs.image.result == 'skipped' && needs.resolve.outputs.build == 'false')) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: mcp-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check the digest is a runnable image index
        if: needs.resolve.outputs.build == 'false'
        env:
          TINYCLOUD_MCP_IMAGE: ${{ needs.resolve.outputs.image }}
        # Use the index digest (the tag's digest or the build log's "exporting manifest list");
        # attestation and single-platform manifest digests are refused.
        shell: bash
        run: |
          docker manifest inspect "$TINYCLOUD_MCP_IMAGE" \
            | jq -e 'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64")' >/dev/null
      - name: Install Phala CLI
        run: npm install --global phala@1.1.22
      - name: Deploy hosted MCP
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TC_MCP_STATE_SECRET: ${{ secrets.TC_MCP_STATE_SECRET }}
          TC_MCP_INTROSPECTION_CLIENT_ID: ${{ secrets.TC_MCP_INTROSPECTION_CLIENT_ID }}
          TC_MCP_INTROSPECTION_CLIENT_SECRET: ${{ secrets.TC_MCP_INTROSPECTION_CLIENT_SECRET }}
          TINYCLOUD_MCP_IMAGE: ${{ needs.resolve.outputs.image }}
          CERTBOT_EMAIL: ops@tinycloud.xyz
        run: |
          test -n "$PHALA_CLOUD_API_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$TC_MCP_STATE_SECRET"
          test -n "$TC_MCP_INTROSPECTION_CLIENT_ID"
          test -n "$TC_MCP_INTROSPECTION_CLIENT_SECRET"
          # Always update the existing CVM, which holds the mcp-state volume. A failed
          # lookup must not fall through to creating an empty replacement; creating the
          # CVM for the first time is a manual step.
          phala deploy \
            --api-token "$PHALA_CLOUD_API_KEY" \
            --cvm-id tinycloud-mcp \
            --compose packages/mcp/docker-compose.phala.yml \
            --env "TINYCLOUD_MCP_IMAGE=$TINYCLOUD_MCP_IMAGE" \
            --env "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" \
            --env "TC_MCP_STATE_SECRET=$TC_MCP_STATE_SECRET" \
            --env "TC_MCP_INTROSPECTION_CLIENT_ID=$TC_MCP_INTROSPECTION_CLIENT_ID" \
            --env "TC_MCP_INTROSPECTION_CLIENT_SECRET=$TC_MCP_INTROSPECTION_CLIENT_SECRET" \
            --env "CERTBOT_EMAIL=$CERTBOT_EMAIL" \
            --no-public-logs \
            --no-public-sysinfo \
            --no-dev-os \
            --image "$PHALA_OS_IMAGE" \
            --wait
      # Fail closed if the deploy left the CVM on a different OS image (same rule as the check before the deploy).
      - name: Verify the OS image after deploy
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        shell: bash
        run: |
          if ! cvm=$(phala cvms get tinycloud-mcp --api-token "$PHALA_CLOUD_API_KEY" --json); then
            echo "::error::Phala could not read the OS image of CVM tinycloud-mcp after deploy"
            exit 1
          fi
          bash .github/scripts/phala-os-guard.sh <<<"$cvm"
      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 10 --retry-all-errors \
            https://mcp.tinycloud.xyz/healthz
          curl --fail --silent --show-error \
            https://mcp.tinycloud.xyz/.well-known/oauth-protected-resource/mcp \
            | jq -e '.resource == "https://mcp.tinycloud.xyz/mcp"'
