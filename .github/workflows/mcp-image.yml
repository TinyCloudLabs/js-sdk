name: Publish hosted MCP image
run-name: Hosted MCP ${{ inputs.package_version }}${{ inputs.image_digest }}

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Published @tinycloud/mcp version to build and deploy (leave empty when image_digest is set)
        required: false
        type: string
      image_digest:
        description: Redeploy an existing ghcr.io/tinycloudlabs/tinycloud-mcp image by digest (sha256:...) without building, for rollback
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pick.outputs.image }}
      build: ${{ steps.pick.outputs.build }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - name: Pick the image to deploy
        id: pick
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          if [ -n "$PACKAGE_VERSION" ] && [ -n "$IMAGE_DIGEST" ]; then
            echo "::error::Set package_version or image_digest, not both"
            exit 1
          fi
          if [ -n "$IMAGE_DIGEST" ]; then
            if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::image_digest must be sha256: followed by 64 lowercase hex characters"
              exit 1
            fi
            echo "image=ghcr.io/tinycloudlabs/tinycloud-mcp@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$PACKAGE_VERSION" ]; then
            if ! [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::package_version must be a published version such as 0.5.0-beta.7"
              exit 1
            fi
            echo "image=ghcr.io/tinycloudlabs/tinycloud-mcp:$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
            echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set package_version to build and deploy, or image_digest to redeploy an existing image"
            exit 1
          fi
  image:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: packages/mcp
          push: true
          build-args: TINYCLOUD_MCP_VERSION=${{ needs.resolve.outputs.version }}
          tags: |
            ghcr.io/tinycloudlabs/tinycloud-mcp:${{ needs.resolve.outputs.version }}
            ghcr.io/tinycloudlabs/tinycloud-mcp:latest
  deploy:
    needs: [resolve, image]
    # A digest redeploy skips the image job; deploy after a successful build or that skip only.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.image.result == 'success' || (needs.image.result == 'skipped' && needs.resolve.outputs.build == 'false')) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: mcp-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check the digest is a runnable image index
        if: needs.resolve.outputs.build == 'false'
        env:
          TINYCLOUD_MCP_IMAGE: ${{ needs.resolve.outputs.image }}
        # Use the index digest (the tag's digest or the build log's "exporting manifest list");
        # attestation and single-platform manifest digests are refused.
        shell: bash
        run: |
          docker manifest inspect "$TINYCLOUD_MCP_IMAGE" \
            | jq -e 'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64")' >/dev/null
      - name: Install Phala CLI
        run: npm install --global phala@1.1.22
      - name: Deploy hosted MCP
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TC_MCP_STATE_SECRET: ${{ secrets.TC_MCP_STATE_SECRET }}
          TINYCLOUD_MCP_IMAGE: ${{ needs.resolve.outputs.image }}
          CERTBOT_EMAIL: ops@tinycloud.xyz
        run: |
          test -n "$PHALA_CLOUD_API_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$TC_MCP_STATE_SECRET"
          if phala cvms ls --json | jq -e '.items[] | select(.cvmName == "tinycloud-mcp")' >/dev/null; then
            target=(--cvm-id tinycloud-mcp)
          else
            target=(--name tinycloud-mcp --instance-type tdx.small)
          fi
          phala deploy \
            --api-token "$PHALA_CLOUD_API_KEY" \
            "${target[@]}" \
            --compose packages/mcp/docker-compose.phala.yml \
            --env "TINYCLOUD_MCP_IMAGE=$TINYCLOUD_MCP_IMAGE" \
            --env "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" \
            --env "TC_MCP_STATE_SECRET=$TC_MCP_STATE_SECRET" \
            --env "CERTBOT_EMAIL=$CERTBOT_EMAIL" \
            --no-public-logs \
            --no-public-sysinfo \
            --wait
      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 10 --retry-all-errors \
            https://mcp.tinycloud.xyz/healthz
          curl --fail --silent --show-error \
            https://mcp.tinycloud.xyz/.well-known/oauth-protected-resource/mcp \
            | jq -e '.resource == "https://mcp.tinycloud.xyz/mcp"'
