name: TC-191 I0 gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # npm pack must not consume a pre-existing user cache.
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
  # Preserve the Bun 1.2.0 concurrent-JIT WASM corruption workaround.
  BUN_JSC_useConcurrentJIT: "0"

jobs:
  i0-build:
    name: I0 shared build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Node 20.19.4 for CLI, MCP, and packed graph checks
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Preserve installed Rust paths for isolated tests
        run: |
          rustup_home="$(rustup show home)"
          echo "RUSTUP_HOME=$rustup_home" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
      - name: Restore Rust/Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ github.workflow }}-i0-gate-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-stable-${{ github.workflow }}-i0-gate-

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Verify pinned runtimes
        run: |
          test "$(node --version)" = "v20.19.4"
          test "$(node -p 'process.versions.node.split(".")[0]')" = "20"
          test "$(bun --version)" = "1.2.0"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # The operations declaration build imports sdk-core's public types.
      - name: Build SDK declarations for packed public API checks
        run: |
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build

      - name: Build SDK WASM runtime dependencies
        run: |
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          bun run --cwd packages/sdk-rs build:wasm:web
          bun run --cwd packages/sdk-rs/packages/web build

      # web-sdk's opt-in replica entries type-check against @tinycloud/replica's
      # built declarations (kv-storage, profile-gate), so build replica first.
      - name: Build node and web SDK declarations
        env:
          # web-sdk's webpack build exceeds Node's default ~2 GB heap (TC-2952).
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          bun run --cwd packages/node-sdk build
          bun run --cwd packages/replica build
          bun run --cwd packages/web-sdk build

      - name: Build operations package
        run: bun run --cwd packages/operations build

      - name: Build the packed CLI artifact
        run: |
          bun run --cwd packages/courier build
          bun run --cwd packages/cli build

      - name: Archive shared build outputs
        run: |
          tar -czf "$RUNNER_TEMP/i0-build.tar.gz" \
            packages/{bootstrap,sdk-services,share-envelope,share-sdk,sdk-core,node-sdk,replica,web-sdk,operations,courier,cli}/dist \
            packages/sdk-rs/{node-sdk-wasm,web-sdk-wasm,packages/node/dist,packages/node/src/wasm,packages/web/dist}

      - uses: actions/upload-artifact@v4
        with:
          name: i0-build
          path: ${{ runner.temp }}/i0-build.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Save Rust/Cargo cache
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ github.workflow }}-i0-gate-${{ hashFiles('Cargo.lock') }}

  i0-tests:
    name: I0 tests (${{ matrix.shard }})
    needs: i0-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Measured groups: Courier, packed CLI, packed entrypoints, and the
        # remaining focused contracts/public API each take about 3 minutes.
        shard: [contracts, courier, packed-cli, entrypoints]
    env:
      NODE_BINARY: node
      CLI_NODE_BINARY: node
      EXPECTED_NODE_MAJOR: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Verify pinned runtimes
        run: |
          test "$(node --version)" = "v20.19.4"
          test "$(node -p 'process.versions.node.split(".")[0]')" = "20"
          test "$(bun --version)" = "1.2.0"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # The packed-graph tests still rebuild from git archive HEAD. Do not
      # replace that independent source/packaging boundary with the artifact.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.shard == 'packed-cli' || matrix.shard == 'entrypoints'
        with:
          targets: wasm32-unknown-unknown
      - name: Preserve installed Rust paths for isolated tests
        if: matrix.shard == 'packed-cli' || matrix.shard == 'entrypoints'
        run: |
          echo "RUSTUP_HOME=$(rustup show home)" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
      - name: Restore Rust/Cargo cache
        if: matrix.shard == 'packed-cli' || matrix.shard == 'entrypoints'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ github.workflow }}-i0-gate-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-stable-${{ github.workflow }}-i0-gate-
      - name: Install wasm-pack
        if: matrix.shard == 'packed-cli' || matrix.shard == 'entrypoints'
        uses: ./.github/actions/install-wasm-pack

      - uses: actions/download-artifact@v4
        with:
          name: i0-build
          path: ${{ runner.temp }}
      - name: Restore shared build outputs
        run: tar -xzf "$RUNNER_TEMP/i0-build.tar.gz"
      - name: Run every file in this shard offline
        env:
          NPM_CONFIG_OFFLINE: "true"
          NPM_CONFIG_REGISTRY: "http://127.0.0.1:9"
          # The serial packed-entrypoints step had no heap override.
          NODE_OPTIONS: ${{ matrix.shard != 'entrypoints' && '--max-old-space-size=6144' || '' }}
        run: python3 .github/scripts/i0-shards.py run "${{ matrix.shard }}"
      - name: Upload runner-observed test files
        uses: actions/upload-artifact@v4
        with:
          name: i0-coverage-${{ matrix.shard }}
          path: .i0-coverage/${{ matrix.shard }}/${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: error

  shard-coverage:
    name: I0 shard coverage
    needs: i0-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test coverage verifier
        run: python3 -m unittest discover -s .github/scripts -p test_i0_shards.py
      - uses: actions/download-artifact@v4
        with:
          pattern: i0-coverage-*
          merge-multiple: true
          path: .i0-collected
      - name: Verify all discovered I0 files ran exactly once
        run: python3 .github/scripts/i0-shards.py verify .i0-collected

  i0-gate:
    # Keep the existing required check name; failures and cancellations must
    # never become a green or skipped compatibility gate.
    name: I0 compatibility and MCP contract
    needs: [i0-build, i0-tests, shard-coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the build, every shard, and complete file coverage
        env:
          BUILD_RESULT: ${{ needs.i0-build.result }}
          TEST_RESULT: ${{ needs.i0-tests.result }}
          COVERAGE_RESULT: ${{ needs.shard-coverage.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$TEST_RESULT" = success
          test "$COVERAGE_RESULT" = success
