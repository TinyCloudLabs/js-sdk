name: Node SDK replication e2e

on:
  pull_request:
    paths:
      - "packages/node-sdk/**"
      - "packages/sdk-services/src/kv/**"
      - "packages/sdk-core/src/**"
      - "packages/replica/**"
      - "packages/sdk-rs/**"
      - "packages/operations/src/operations/knowledge*"
      - "packages/cli/src/commands/knowledge*"
      - "packages/cli/src/lib/apps-agent-preset*"
      - "packages/cli/src/commands/agent-grant-openkey*"
      - "packages/cli/src/commands/onboard*"
      - "packages/cli/src/commands/auth.ts"
      - "packages/cli/src/auth/scoped-login.ts"
      - ".github/workflows/node-replication-e2e.yml"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  # tinycloud-node v1.20.6 pinned by digest, with the TC-899 fix (see replica-e2e.yml).
  TINYCLOUD_NODE_IMAGE: ghcr.io/tinycloudlabs/tinycloud-node:1.20.6@sha256:41667d3d133aaa12290a2f3a744afacd838988327552d159c60f04466e66f86f

jobs:
  node-replication-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Restore Rust/Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build node-sdk replication dependencies
        run: |
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          bun run --cwd packages/sdk-rs build:wasm:web
          bun run --cwd packages/sdk-rs/packages/web build
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build
          bun run --cwd packages/node-sdk build
          bun run --cwd packages/replica build
          bun run --cwd packages/operations build
          bun run --cwd packages/courier build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the pinned TinyCloud node
        run: |
          docker pull "$TINYCLOUD_NODE_IMAGE"
          container="$(docker create "$TINYCLOUD_NODE_IMAGE")"
          docker cp "$container:/tinycloud" "$RUNNER_TEMP/tinycloud"
          docker rm "$container"
          chmod +x "$RUNNER_TEMP/tinycloud"

      - name: Run node-sdk replication e2e
        env:
          TC_REPLICATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
        run: bun test --max-concurrency=1 packages/node-sdk/src/replication/replication.e2e.test.ts packages/node-sdk/src/TinyCloudNode.revokeDelegation.e2e.test.ts packages/node-sdk/src/TinyCloudNode.encryptionNetwork.e2e.test.ts

      - name: Run node-sdk terminal delegation e2e
        env:
          TC_TERMINAL_DELEGATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
        run: bun test --max-concurrency=1 packages/node-sdk/src/TinyCloudNode.terminalDelegation.e2e.test.ts

      - name: Run knowledge CLI e2e (apps-agent preset, knowledge list|read)
        env:
          TC_REPLICATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
        run: bun test --max-concurrency=1 packages/cli/src/commands/knowledge.e2e.test.ts

      - name: Run agent grant OpenKey e2e (approval-scoped grant, real node)
        env:
          TC_REPLICATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
        run: bun test --max-concurrency=1 packages/cli/src/commands/agent-grant-openkey.e2e.test.ts

      - name: Run onboard e2e (profile, two OpenKey approvals, real node)
        env:
          TC_REPLICATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
        run: bun test --max-concurrency=1 packages/cli/src/commands/onboard.e2e.test.ts

      - name: Save Rust/Cargo cache
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
