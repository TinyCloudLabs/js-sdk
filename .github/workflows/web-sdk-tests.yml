name: Web SDK tests

# Runs every packages/web-sdk test file under Bun, one file per process:
# the files install conflicting global browser shims and module mocks.

on:
  pull_request:
    paths:
      - "packages/web-sdk/**"
      - "packages/bootstrap/**"
      - "packages/node-sdk/**"
      - "packages/replica/**"
      - "packages/sdk-core/**"
      - "packages/sdk-rs/**"
      - "packages/sdk-services/**"
      - "packages/share-envelope/**"
      - "packages/share-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/web-sdk-tests.yml"
  push:
    branches: [master]
    paths:
      - "packages/web-sdk/**"
      - "packages/bootstrap/**"
      - "packages/node-sdk/**"
      - "packages/replica/**"
      - "packages/sdk-core/**"
      - "packages/sdk-rs/**"
      - "packages/sdk-services/**"
      - "packages/share-envelope/**"
      - "packages/share-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/web-sdk-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-sdk-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-sdk-tests:
    name: Run web-sdk test files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Restore Rust/Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # Tests import workspace packages through their dist exports; two JS
      # tests load web-sdk's own dist/index.cjs.
      - name: Build web-sdk and its workspace dependencies
        run: bunx turbo build --filter=@tinycloud/web-sdk...

      # coordinationos-vendor.test.ts imports the generated vendor bundle and manifest.
      - name: Build the CoordinationOS vendor bundle
        run: bun run --cwd packages/web-sdk build:coordinationos-vendor

      - name: Run each web-sdk test file
        working-directory: packages/web-sdk
        env:
          BUN_JSC_useConcurrentJIT: "0"
          # No paired OpenCredentials checkout in CI; the suite prints its skip reason.
          OPENCREDENTIALS_FIXTURE_OPTIONAL: "1"
        run: |
          declare -A skip=(
            [tests/web-sdk.test.ts]="Jest-only suite (jest.mock automock, eth-testing provider, TinyCloud server on localhost:3001); not runnable under bun test"
            [tests/siwe-signature-init.test.js]="exercises an in-file MockUserAuthorization rather than web-sdk source, and 3 of its cases fail against that mock"
          )
          passed=()
          failed=()
          for file in tests/*.test.ts tests/*.test.js; do
            if [[ -v skip[$file] ]]; then
              echo "SKIP $file: ${skip[$file]}"
              echo "::notice title=Skipped $file::${skip[$file]}"
              continue
            fi
            echo "::group::$file"
            if bun test "./$file"; then
              passed+=("$file")
            else
              failed+=("$file")
              echo "::error title=web-sdk test failed::$file"
            fi
            echo "::endgroup::"
          done
          echo "Passed ${#passed[@]}, failed ${#failed[@]}, skipped ${#skip[@]}"
          if (( ${#failed[@]} > 0 )); then
            printf 'FAIL %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Save Rust/Cargo cache
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
