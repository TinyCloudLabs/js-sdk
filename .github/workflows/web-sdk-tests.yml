name: Web SDK tests

# Runs every packages/web-sdk test file under Bun, one file per process:
# the files install conflicting global browser shims and module mocks.

# No `paths:` filter on the triggers: this check is required by the master
# ruleset, and a required check that never reports blocks docs-only PRs.
# The workflow always runs; the "Decide whether to run" step decides whether
# the real steps execute. The job name must not change (ruleset context).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # the gate step lists PR files via the API

concurrency:
  group: web-sdk-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-sdk-tests:
    name: Run web-sdk test files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Only pull_request events can be skipped. push (master) and
      # workflow_dispatch always run the full suite.
      # `dorny/paths-filter` is not in this repo's allowed-actions list, so the
      # changed-file list comes from the GitHub API (same source it uses).
      - name: Decide whether to run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running web-sdk tests (event: $EVENT)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The files API caps at 3000 entries; a larger PR may hide relevant files, so run.
          changed="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .changed_files)"
          if (( changed >= 3000 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running web-sdk tests: $changed changed files exceeds the file-list API cap." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          relevant=""
          while IFS= read -r f; do
            case "$f" in
              packages/web-sdk/*|packages/bootstrap/*|packages/node-sdk/*|packages/replica/*|packages/sdk-core/*|packages/sdk-rs/*|packages/sdk-services/*|packages/share-envelope/*|packages/share-sdk/*|Cargo.toml|Cargo.lock|bun.lock|package.json|turbo.json|tsconfig.base.json|scripts/setup.sh|.github/workflows/web-sdk-tests.yml|.github/scripts/check-package-exports-exist*)
                relevant="$f"; break ;;
            esac
          done <<< "$files"
          if [[ -n "$relevant" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running web-sdk tests: relevant change in \`$relevant\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Run web-sdk test files: skipped"
              echo "Skipped: no relevant changes (no web-sdk or dependency paths changed in this pull request)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version: 1.3.14
      - name: Cache Bun packages
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
        with:
          targets: wasm32-unknown-unknown
      - name: Restore Rust/Cargo cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-

      - name: Install wasm-pack
        if: steps.gate.outputs.run == 'true'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install locked dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      # Tests import workspace packages through their dist exports; two JS
      # tests load web-sdk's own dist/index.cjs.
      - name: Build web-sdk and its workspace dependencies
        if: steps.gate.outputs.run == 'true'
        run: bunx turbo build --filter=@tinycloud/web-sdk...

      # A broken `exports` target (missing types file, subpath bundle never
      # emitted) only fails for consumers. Check the built package itself.
      - name: Check that every web-sdk export target exists
        if: steps.gate.outputs.run == 'true'
        run: |
          node --test .github/scripts/check-package-exports-exist.test.mjs
          node .github/scripts/check-package-exports-exist.mjs packages/web-sdk

      # coordinationos-vendor.test.ts imports the generated vendor bundle and manifest.
      - name: Build the CoordinationOS vendor bundle
        if: steps.gate.outputs.run == 'true'
        run: bun run --cwd packages/web-sdk build:coordinationos-vendor

      - name: Run each web-sdk test file
        if: steps.gate.outputs.run == 'true'
        working-directory: packages/web-sdk
        env:
          BUN_JSC_useConcurrentJIT: "0"
          # No paired OpenCredentials checkout in CI; the suite skips its tests and prints why.
          OPENCREDENTIALS_FIXTURE_OPTIONAL: "1"
        run: |
          set -o pipefail
          declare -A skip=()
          log="$RUNNER_TEMP/web-sdk-test.log"
          passed=()
          skipped=()
          failed=()
          for file in tests/*.test.ts tests/*.test.js tests/*.bun.ts tests/ui/*.test.ts; do
            reason="${skip[$file]:-}"
            if [[ -z "$reason" ]]; then
              echo "::group::$file"
              if ! bun test "./$file" 2>&1 | tee "$log"; then
                failed+=("$file")
                echo "::error title=web-sdk test failed::$file"
              elif grep -Eq '\b0 pass\b' "$log" && grep -Eq '\b[1-9][0-9]* skip\b' "$log"; then
                # Every test was skipped at runtime; report the file's own reason.
                reason="$(grep -m1 -o 'Skipping .*' "$log" || echo "all tests skipped")"
              else
                passed+=("$file")
              fi
              echo "::endgroup::"
            fi
            if [[ -n "$reason" ]]; then
              skipped+=("$file")
              echo "SKIP $file: $reason"
              echo "::notice title=Skipped $file::$reason"
            fi
          done
          echo "Passed ${#passed[@]}, skipped ${#skipped[@]}, failed ${#failed[@]}"
          printf 'PASS %s\n' "${passed[@]}"
          printf 'SKIP %s\n' "${skipped[@]}"
          if (( ${#failed[@]} > 0 )); then
            printf 'FAIL %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Install Playwright Chromium
        if: steps.gate.outputs.run == 'true'
        working-directory: packages/web-sdk
        run: bunx playwright install --with-deps chromium

      - name: Run browser smoke tests
        if: steps.gate.outputs.run == 'true'
        working-directory: packages/web-sdk
        run: bun run test:e2e

      - name: Save Rust/Cargo cache
        if: steps.gate.outputs.run == 'true' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
