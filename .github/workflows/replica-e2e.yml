name: Replica e2e

# `tc replica` (TC-18) against a real TinyCloud node through the public CLI:
# device grant, sync, offline restart reads, catch-up, scope. The node binary
# comes from the pinned GHCR image of the tinycloud-node commit that serves
# `tinycloud.kv/sync` (TC-732, d7f511f on main). That commit (PR #247) also
# registers `tinycloud.kv/retain` and attests `retainUntil`, which the
# retention test needs. The image is public; the job still logs in with the
# workflow token so the pull keeps working if the package becomes private
# (the package must then grant this repository read access).

on:
  pull_request:
    paths:
      - "packages/replica/**"
      - "packages/cli/**"
      - "packages/sdk-services/src/kv/**"
      - "packages/operations/src/state.ts"
      - ".github/workflows/replica-e2e.yml"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  TINYCLOUD_NODE_IMAGE: ghcr.io/tinycloudlabs/tinycloud-node:d7f511f

jobs:
  replica-e2e:
    name: Replica (Node 22, Bun 1.3.14, ${{ matrix.database }} node)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build the CLI and its packages
        run: |
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build
          bun run --cwd packages/node-sdk build
          bun run --cwd packages/operations build
          bun run --cwd packages/replica build
          bun run --cwd packages/cli build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the pinned node binary
        run: |
          docker pull "$TINYCLOUD_NODE_IMAGE"
          container="$(docker create "$TINYCLOUD_NODE_IMAGE")"
          docker cp "$container:/tinycloud" "$RUNNER_TEMP/tinycloud"
          docker rm "$container"
          chmod +x "$RUNNER_TEMP/tinycloud"

      - name: Start Postgres 16
        if: matrix.database == 'postgres'
        run: |
          docker run -d --name replica-e2e-pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=replica_e2e -p 127.0.0.1:5432:5432 postgres:16
          for attempt in $(seq 1 30); do
            docker exec replica-e2e-pg pg_isready -U postgres -d replica_e2e && exit 0
            sleep 2
          done
          docker logs replica-e2e-pg
          exit 1

      - name: Replica engine and store conformance, and CLI profile-deletion safety
        if: matrix.database == 'sqlite'
        run: |
          bun run --cwd packages/replica test
          bun test packages/cli/src/commands/replica.test.ts

      - name: tc replica against the node
        env:
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC_REPLICA_E2E_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@127.0.0.1:5432/replica_e2e' || '' }}
        run: bun test packages/cli/test/replica.e2e.test.ts
