name: Replica e2e

# `tc replica` (TC-18) against a real TinyCloud node through the public CLI:
# device grant, sync, offline restart reads, catch-up, scope. The node binary
# comes from the GHCR image of tinycloud-node v1.20.6 (revision e18578ff),
# pinned by digest. It serves `tinycloud.kv/sync` (`kv-sync-v1`), supports the
# `tinycloud.kv/retain` / `retainUntil` retention test, and includes the TC-899
# "database is locked" first-write fix (37277f0, PR #268) that the earlier
# d7f511f image lacked. QA vetted this digest on SQLite and Postgres 16 (TC-858).
# It also advertises `kv-sync-root` (TC-908), so the CLI e2e suites exercise the
# whole-space root sync. The REPLICATION_ROOT_UNSUPPORTED decision logic stays
# covered without a real node (controller, transport and browser /info-mock
# tests), but the CLI's handling of it (`sync --prefix /` exit 7, the persisted
# lastError, the --replication `unavailable` event) has no CI coverage.
# The image is public; the job still logs in with the workflow token so the pull
# keeps working if the package becomes private (the package must then grant
# this repository read access).

on:
  pull_request:
    paths:
      - "packages/replica/**"
      - "packages/cli/**"
      - "packages/node-sdk/**"
      - "packages/sdk-core/**"
      - "packages/sdk-services/src/**"
      - "packages/sdk-services/package.json"
      - "packages/sdk-services/tsconfig*.json"
      - "packages/operations/**"
      - "packages/web-sdk/**"
      # web-sdk bundles share-sdk (and share-envelope through it), so their
      # changes can move the web-sdk dist sizes this workflow checks.
      - "packages/share-sdk/**"
      - "packages/share-envelope/**"
      - "tests/cli/**"
      - ".github/scripts/**"
      - ".github/workflows/replica-e2e.yml"
      - "tests/replication-harness/**"
      - ".github/workflows/replication-harness.yml"
      # A lockfile-only change can move the bundled worker (#606: +86 B), so
      # root dependency manifests must trigger the size checks too.
      - "bun.lock"
      - "package.json"
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [master]
  workflow_dispatch:

env:
  TC858_MODEL_FULL: ${{ github.event_name == 'schedule' && '1' || '0' }}
  TINYCLOUD_NODE_IMAGE: ghcr.io/tinycloudlabs/tinycloud-node:1.20.6@sha256:41667d3d133aaa12290a2f3a744afacd838988327552d159c60f04466e66f86f

jobs:
  replica-e2e:
    name: Replica (Node 22, Bun 1.3.14, ${{ matrix.database }} node)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - name: Restore Rust/Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.99.0-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-1.99.0-${{ github.workflow }}-${{ github.job }}-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build the CLI and its packages
        run: |
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          # @tinycloud/replica's worker entry imports @tinycloud/web-sdk-wasm.
          bun run --cwd packages/sdk-rs build:wasm:web
          bun run --cwd packages/sdk-rs/packages/web build
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build
          bun run --cwd packages/node-sdk build
          bun run --cwd packages/operations build
          bun run --cwd packages/replica build
          bun run --cwd packages/courier build
          bun run --cwd packages/sdk-services typecheck:contract
          bun run --cwd packages/node-sdk typecheck:replica-contract
          bun run --cwd packages/cli build

      - name: Enforce hashed kv-storage worker gzip ratchet (TC-858)
        if: success() || failure()
        run: bun packages/replica/scripts/check-worker-size.ts

      - name: Check every replica exports target is packed (TC-858)
        run: bun packages/replica/scripts/check-pack-exports.ts

      - name: Build web-sdk for the Phase 1 dist acceptance
        run: bun run --cwd packages/web-sdk build

      - name: Prove built web core and opt-in replica share signed-session authority
        run: |
          bun packages/web-sdk/scripts/check-replica-built-entry.ts mjs
          bun packages/web-sdk/scripts/check-replica-built-entry.ts cjs

      - name: Build CoordinationOS vendor bundle for the web-sdk test baseline
        run: bun run --cwd packages/web-sdk build:coordinationos-vendor

      - name: Check Phase 1 web-sdk dist and test baseline
        env:
          REPLICA_BUDGET_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPLICA_BUDGET_PR_NUMBER: ${{ github.event.pull_request.number }}
          REPLICA_BUDGET_TICKET: ${{ github.event.pull_request.title }}
          # No paired OpenCredentials checkout in CI; credentials.integration.test.ts skips with a warning.
          OPENCREDENTIALS_FIXTURE_OPTIONAL: "1"
        run: bun packages/web-sdk/scripts/check-phase1-replica-dist.ts

      - name: Size-policy unit tests
        if: ${{ (success() || failure()) && matrix.database == 'sqlite' }}
        run: bun test packages/web-sdk/scripts/

      - name: Run replication model
        run: bun test packages/sdk-services/src/kv/replication/pendingWrites.model.test.ts


      # The real-node steps below run even when the size checks fail, so their setup must too;
      # otherwise a size failure cascades into misleading ENOENT failures for the node binary.
      - name: Log in to GHCR
        if: ${{ !cancelled() }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the pinned node binary
        if: ${{ !cancelled() }}
        run: |
          docker pull "$TINYCLOUD_NODE_IMAGE"
          container="$(docker create "$TINYCLOUD_NODE_IMAGE")"
          docker cp "$container:/tinycloud" "$RUNNER_TEMP/tinycloud"
          docker rm "$container"
          chmod +x "$RUNNER_TEMP/tinycloud"
      - name: Prepare JUnit reports
        if: ${{ !cancelled() }}
        run: mkdir -p "$RUNNER_TEMP/replica-junit"

      - name: Start Postgres 16
        if: ${{ !cancelled() && matrix.database == 'postgres' }}
        run: |
          docker run -d --name replica-e2e-pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=replica_e2e -p 127.0.0.1:5432:5432 postgres:16
          for attempt in $(seq 1 30); do
            docker exec replica-e2e-pg pg_isready -U postgres -d replica_e2e && exit 0
            sleep 2
          done
          docker logs replica-e2e-pg
          exit 1

      - name: node-sdk replication against the SQLite node
        if: ${{ !cancelled() && matrix.database == 'sqlite' }}
        env:
          TC_REPLICATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
        run: bun test packages/node-sdk/src/replication/replication.e2e.test.ts --reporter=junit --reporter-outfile="$RUNNER_TEMP/replica-junit/node-sdk.xml"

      - name: node-sdk replication against the Postgres node
        if: ${{ !cancelled() && matrix.database == 'postgres' }}
        env:
          TC_REPLICATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TINYCLOUD_STORAGE__DATABASE: postgres://postgres:postgres@127.0.0.1:5432/replica_e2e
        run: bun test packages/node-sdk/src/replication/replication.e2e.test.ts --reporter=junit --reporter-outfile="$RUNNER_TEMP/replica-junit/node-sdk.xml"

      - name: Replica engine and store conformance
        if: matrix.database == 'sqlite'
        run: bun run --cwd packages/replica test
      - name: CLI profile-deletion safety
        if: ${{ !cancelled() && matrix.database == 'sqlite' }}
        run: |
          mkdir -p "$RUNNER_TEMP/replica-junit"
          bun test packages/cli/src/commands/replica.test.ts --reporter=junit --reporter-outfile="$RUNNER_TEMP/replica-junit/cli-replica-command.xml"

      - name: tc replica against the node
        if: ${{ !cancelled() }}
        env:
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC_REPLICATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC_REPLICA_E2E_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@127.0.0.1:5432/replica_e2e' || '' }}
        run: bun test packages/cli/test/replica.e2e.test.ts --reporter=junit --reporter-outfile="$RUNNER_TEMP/replica-junit/cli-replica-e2e.xml"
      - name: CLI replication flag against the node
        if: ${{ !cancelled() }}
        env:
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC_REPLICATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC_REPLICA_E2E_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@127.0.0.1:5432/replica_e2e' || '' }}
        run: bun test packages/cli/test/replication-flag.e2e.test.ts --reporter=junit --reporter-outfile="$RUNNER_TEMP/replica-junit/cli-flag.xml"
      - name: Enforce real-node JUnit counts and zero skips
        if: always()
        run: bun .github/scripts/check-replica-junit.mjs ${{ matrix.database == 'sqlite' && '--cli-replica-command' || '' }}
      - name: Upload backend JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc858-junit-${{ matrix.database == 'postgres' && 'pg16' || 'sqlite' }}
          path: ${{ runner.temp }}/replica-junit/*.xml
          if-no-files-found: error

      - name: tc secrets request/wait against the node (TC-834)
        if: matrix.database == 'sqlite'
        env:
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
        run: bun test packages/cli/test/secrets-wait.e2e.test.ts

      # The suite skips itself when the node binary variable is unset, so the
      # step fails if any test was skipped.
      # The step runs packages/cli/test/replica-secrets.e2e.test.ts and fails
      # unless at least one test passed and none were skipped.
      - name: tc replica Secrets against the node
        if: matrix.database == 'sqlite'
        timeout-minutes: 10
        env:
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
        run: |
          set -o pipefail
          bun test packages/cli/test/replica-secrets.e2e.test.ts 2>&1 | tee "$RUNNER_TEMP/replica-secrets.log"
          if grep -Eq '^ *[1-9][0-9]* skip' "$RUNNER_TEMP/replica-secrets.log" || ! grep -Eq '^ *[1-9][0-9]* pass' "$RUNNER_TEMP/replica-secrets.log"; then
            echo "::error title=replica Secrets::tests were skipped or none passed"
            exit 1
          fi

      - name: tc delegation revoke from a profile with no grant record, against the node
        if: matrix.database == 'sqlite'
        env:
          TC_REPLICATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
        run: bun test --max-concurrency=1 packages/cli/src/commands/delegation-revoke-lookup.e2e.test.ts

      - name: tc share revoke by ID across re-login and logout, against the node (TC-1669)
        if: matrix.database == 'sqlite'
        env:
          TC_REPLICATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
        run: bun test --max-concurrency=1 packages/cli/src/commands/share-history-revoke.e2e.test.ts

      # tests/cli suites that talk to a node through TC_TEST_SERVER (tests/cli/setup.ts).
      # Each step starts its own loopback node from the pinned binary, waits for
      # /version, runs one file and stops the node (.github/scripts/run-cli-node-suite.sh).
      # tests/cli/duckdb is not run here: the pinned node is built without DuckDB (TC-1965).
      - name: tests/cli kv against the node (TC-1902)
        if: ${{ !cancelled() && matrix.database == 'sqlite' }}
        timeout-minutes: 10
        run: .github/scripts/run-cli-node-suite.sh "$RUNNER_TEMP/tinycloud" tests/cli/kv/kv.test.ts

      - name: tests/cli sql against the node (TC-1902)
        if: ${{ !cancelled() && matrix.database == 'sqlite' }}
        timeout-minutes: 10
        run: .github/scripts/run-cli-node-suite.sh "$RUNNER_TEMP/tinycloud" tests/cli/sql/sql.test.ts

      - name: tests/cli secrets e2e against the node (TC-1902)
        if: ${{ !cancelled() && matrix.database == 'sqlite' }}
        timeout-minutes: 10
        run: .github/scripts/run-cli-node-suite.sh "$RUNNER_TEMP/tinycloud" tests/cli/secrets/secrets-e2e.test.ts

      - name: Stop any tests/cli node still running
        if: ${{ always() && matrix.database == 'sqlite' }}
        run: |
          for pidfile in "$RUNNER_TEMP"/cli-node-suites/*.pid; do
            [ -f "$pidfile" ] || continue
            kill "$(cat "$pidfile")" 2>/dev/null || true
          done

      - name: Save Rust/Cargo cache
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.99.0-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}

  browser-e2e:
    name: Replica (Chromium, browser worker + IndexedDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Restore Rust/Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Build the packages the browser bundle needs
        run: |
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          bun run --cwd packages/sdk-rs build:wasm:web
          bun run --cwd packages/sdk-rs/packages/web build
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build
          bun run --cwd packages/node-sdk build
          bun run --cwd packages/replica build
          # The read-through fixture page (node.html) uses web-sdk's browser WASM bindings.
          bun run --cwd packages/web-sdk build

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Extract the pinned node binary
        run: |
          docker pull "$TINYCLOUD_NODE_IMAGE"
          container="$(docker create "$TINYCLOUD_NODE_IMAGE")"
          docker cp "$container:/tinycloud" "$RUNNER_TEMP/tinycloud"
          docker rm "$container"
          chmod +x "$RUNNER_TEMP/tinycloud"

      - name: Build the browser fixture page
        run: bunx vite build
        working-directory: packages/replica/test/browser/fixture

      - name: Browser replica against the node
        env:
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
        run: bun test packages/replica/test/browser.e2e.test.ts

      - name: Build the acceptance fixture page
        run: bunx vite build
        working-directory: packages/replica/test/browser/acceptance

      - name: Browser acceptance (TC-858, Chromium)
        env:
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC858_ACCEPTANCE_STRICT: "1"
        run: |
          set -o pipefail
          bun test packages/replica/test/browser.acceptance.test.ts --timeout 200000 2>&1 | tee "$RUNNER_TEMP/acceptance.log"
          # Strict mode means every scenario ran: a todo or skipped entry proves nothing.
          if grep -E '^\((todo|skip)\)' "$RUNNER_TEMP/acceptance.log"; then
            echo "::error::browser acceptance has todo/skipped scenarios"
            exit 1
          fi
          grep -qE '^ *[1-9][0-9]* pass$' "$RUNNER_TEMP/acceptance.log"

      - name: kv-storage adapter in Chromium (fake feed and the node)
        if: always()
        env:
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC_KV_STORAGE_E2E: "1"
        run: bun test packages/replica/test/kv-storage.e2e.test.ts

      - name: Save Rust/Cargo cache
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
