name: Replica e2e

# `tc replica` (TC-18) against a real TinyCloud node through the public CLI:
# device grant, sync, offline restart reads, catch-up, scope. The node binary
# comes from the pinned GHCR image of the tinycloud-node commit that serves
# `tinycloud.kv/sync` (TC-732, d7f511f on main). That commit (PR #247) also
# registers `tinycloud.kv/retain` and attests `retainUntil`, which the
# retention test needs. The image is public; the job still logs in with the
# workflow token so the pull keeps working if the package becomes private
# (the package must then grant this repository read access).

on:
  pull_request:
    paths:
      - "packages/replica/**"
      - "packages/cli/**"
      - "packages/node-sdk/**"
      - "packages/sdk-core/**"
      - "packages/sdk-services/src/**"
      - "packages/operations/src/state.ts"
      - "packages/web-sdk/**"
      - ".github/scripts/**"
      - ".github/workflows/replica-e2e.yml"
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [master]
  workflow_dispatch:

env:
  TC858_MODEL_FULL: ${{ github.event_name == 'schedule' && '1' || '0' }}
  TINYCLOUD_NODE_IMAGE: ghcr.io/tinycloudlabs/tinycloud-node:d7f511f

jobs:
  replica-e2e:
    name: Replica (Node 22, Bun 1.3.14, ${{ matrix.database }} node)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build the CLI and its packages
        run: |
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          # @tinycloud/replica's worker entry imports @tinycloud/web-sdk-wasm.
          bun run --cwd packages/sdk-rs build:wasm:web
          bun run --cwd packages/sdk-rs/packages/web build
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build
          bun run --cwd packages/node-sdk build
          bun run --cwd packages/operations build
          bun run --cwd packages/replica build
          bun run --cwd packages/node-sdk typecheck:replica-contract
          bun run --cwd packages/cli build

      - name: Build web-sdk for the Phase 1 dist acceptance
        run: bun run --cwd packages/web-sdk build

      - name: Check Phase 1 web-sdk dist and test baseline
        run: bun packages/web-sdk/scripts/check-phase1-replica-dist.ts

      - name: Run replication model
        run: bun test packages/sdk-services/src/kv/replication/pendingWrites.model.test.ts


      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the pinned node binary
        run: |
          docker pull "$TINYCLOUD_NODE_IMAGE"
          container="$(docker create "$TINYCLOUD_NODE_IMAGE")"
          docker cp "$container:/tinycloud" "$RUNNER_TEMP/tinycloud"
          docker rm "$container"
          chmod +x "$RUNNER_TEMP/tinycloud"
      - name: Prepare JUnit reports
        run: mkdir -p "$RUNNER_TEMP/replica-junit"

      - name: node-sdk replication against the node
        if: matrix.database == 'sqlite'
        env:
          TC_REPLICATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
        run: bun test packages/node-sdk/src/replication/replication.e2e.test.ts --reporter=junit --reporter-outfile="$RUNNER_TEMP/replica-junit/node-sdk.xml"

      - name: Start Postgres 16
        if: matrix.database == 'postgres'
        run: |
          docker run -d --name replica-e2e-pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=replica_e2e -p 127.0.0.1:5432:5432 postgres:16
          for attempt in $(seq 1 30); do
            docker exec replica-e2e-pg pg_isready -U postgres -d replica_e2e && exit 0
            sleep 2
          done
          docker logs replica-e2e-pg
          exit 1

      - name: Replica engine and store conformance, and CLI profile-deletion safety
        if: matrix.database == 'sqlite'
        run: |
          bun run --cwd packages/replica test
          mkdir -p "$RUNNER_TEMP/replica-junit"
          bun test packages/cli/src/commands/replica.test.ts --reporter=junit --reporter-outfile="$RUNNER_TEMP/replica-junit/cli-replica-command.xml"

      - name: tc replica against the node
        env:
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC_REPLICATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC_REPLICA_E2E_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@127.0.0.1:5432/replica_e2e' || '' }}
        run: bun test packages/cli/test/replica.e2e.test.ts --reporter=junit --reporter-outfile="$RUNNER_TEMP/replica-junit/cli-replica-e2e.xml"
      - name: CLI replication flag against the node
        env:
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC_REPLICATION_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
          TC_REPLICA_E2E_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@127.0.0.1:5432/replica_e2e' || '' }}
        run: bun test packages/cli/test/replication-flag.e2e.test.ts --reporter=junit --reporter-outfile="$RUNNER_TEMP/replica-junit/cli-flag.xml"
      - name: Enforce real-node JUnit counts and zero skips
        run: bun .github/scripts/check-replica-junit.mjs ${{ matrix.database == 'sqlite' && '--node-sdk' || '' }}
      - name: Upload backend JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc858-junit-${{ matrix.database == 'postgres' && 'pg16' || 'sqlite' }}
          path: ${{ runner.temp }}/replica-junit/*.xml
          if-no-files-found: error

  browser-e2e:
    name: Replica (Chromium, browser worker + IndexedDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build the packages the browser bundle needs
        run: |
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          bun run --cwd packages/sdk-rs build:wasm:web
          bun run --cwd packages/sdk-rs/packages/web build
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build
          bun run --cwd packages/node-sdk build
          bun run --cwd packages/replica build

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Extract the pinned node binary
        run: |
          docker pull "$TINYCLOUD_NODE_IMAGE"
          container="$(docker create "$TINYCLOUD_NODE_IMAGE")"
          docker cp "$container:/tinycloud" "$RUNNER_TEMP/tinycloud"
          docker rm "$container"
          chmod +x "$RUNNER_TEMP/tinycloud"

      - name: Build the browser fixture page
        run: bunx vite build
        working-directory: packages/replica/test/browser/fixture

      - name: Browser replica against the node
        env:
          TC_REPLICA_E2E_NODE_BIN: ${{ runner.temp }}/tinycloud
        run: bun test packages/replica/test/browser.e2e.test.ts
