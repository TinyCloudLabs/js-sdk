name: Authority tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK authority packages
        run: |
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          bun run --cwd packages/node-sdk build

      - name: Test SDK authority surfaces (excluding harness-dependent e2e)
        run: |
          bun run --cwd packages/sdk-core test
          bun run --cwd packages/sdk-services test
          # Run the node-sdk suite EXCEPT the two harness-dependent e2e files.
          # Those live in the dedicated cross-repo jobs below where OpenKey is
          # actually checked out.
          bun test --max-concurrency=1 \
            $(find packages/node-sdk/src -name "*.test.ts" \
                ! -name "NodeUserAuthorization.crossRepoHono.e2e.test.ts" \
                ! -name "NodeUserAuthorization.openKeyBrowserVertical.e2e.test.ts")

  # Real cross-repo contract: check out both js-sdk and OpenKey, spawn the
  # real Hono authorize-sign harness, and exercise the wire shape. This is
  # the authoritative test that the js-sdk consumer accepts the real
  # Hono response body — it MUST NOT be a silent-skip.
  cross-repo-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out js-sdk
        uses: actions/checkout@v4
        with:
          path: js-sdk

      # Pin to a compatible OpenKey revision. Bump this when the OpenKey
      # HEAD moves to keep the cross-repo contract test in sync.
      - name: Check out OpenKey at a compatible revision
        uses: actions/checkout@v4
        with:
          repository: TinyCloudLabs/openkey
          # Immutable OpenKey PR #160 revision with:
          #   - production canonicalization of permissions[].service in
          #     /authorize-sign-preview and /authorize-sign response bodies
          #   - the vertical-happy-path-harness with no test-only response
          #     rewriting
          # After OpenKey merges, bump this to the resulting main SHA.
          ref: ${{ vars.OPENKEY_VERTICAL_PIN || 'main' }}
          path: openkey

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install js-sdk dependencies
        working-directory: js-sdk
        run: bun install --frozen-lockfile

      - name: Install OpenKey dependencies
        working-directory: openkey
        run: bun install --frozen-lockfile

      - name: Build js-sdk authority packages
        working-directory: js-sdk
        run: |
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          bun run --cwd packages/node-sdk build

      - name: Run cross-repo Hono contract test
        working-directory: js-sdk
        env:
          # Point the js-sdk test at the sibling OpenKey checkout so the
          # harness is discovered without any developer worktree layout.
          OPENKEY_WORKTREE: ${{ github.workspace }}/openkey
          # The harness itself refuses to run without this belt-and-
          # suspenders env being set (see scripts/authorize-sign-harness.test.ts).
          OPENKEY_RUN_HARNESS: "1"
        run: |
          bun test packages/node-sdk/src/authorization/NodeUserAuthorization.crossRepoHono.e2e.test.ts

  # Vertical browser journey: manifest → real Hono preview/finalize routes
  # → mounted production widget UI → operator approval → js-sdk
  # signInWithOpenKeyResult. Proves byte-for-byte equality of the
  # displayed raw bytes and the resulting session.siwe. Runs the SAME
  # browser test as local development so the contract is captured
  # end-to-end in CI.
  cross-repo-vertical-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out js-sdk
        uses: actions/checkout@v4
        with:
          path: js-sdk

      - name: Check out OpenKey at a compatible revision
        uses: actions/checkout@v4
        with:
          repository: TinyCloudLabs/openkey
          ref: ${{ vars.OPENKEY_VERTICAL_PIN || 'main' }}
          path: openkey

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install js-sdk dependencies
        working-directory: js-sdk
        run: bun install --frozen-lockfile

      - name: Install OpenKey dependencies
        working-directory: openkey
        run: bun install --frozen-lockfile

      - name: Build js-sdk authority packages
        working-directory: js-sdk
        run: |
          bun run --cwd packages/bootstrap build
          bun run --cwd packages/sdk-services build
          bun run --cwd packages/share-envelope build
          bun run --cwd packages/share-sdk build
          bun run --cwd packages/sdk-core build
          bun run --cwd packages/sdk-rs build:wasm:node
          bun run --cwd packages/sdk-rs/packages/node build
          bun run --cwd packages/node-sdk build

      # The vertical browser test loads OpenKey `packages/sdk/dist/index.mjs`
      # and `packages/core/dist/index.js` from disk. Both are ignored by
      # git, so a clean checkout must build them first.
      - name: Build OpenKey SDK/core dist inputs
        working-directory: openkey
        run: |
          bun run --cwd packages/core build
          bun run --cwd packages/sdk build

      # Install a pinned Playwright browser bundle deterministically. The
      # vertical test imports `playwright` and launches chromium
      # `headless: true` — without this step the launch throws with a
      # missing-executable error on clean CI runners.
      - name: Install Playwright chromium (deterministic)
        working-directory: js-sdk
        run: |
          bunx playwright install --with-deps chromium

      - name: Run vertical browser journey
        working-directory: js-sdk
        env:
          OPENKEY_WORKTREE: ${{ github.workspace }}/openkey
        run: |
          bun test packages/node-sdk/src/authorization/NodeUserAuthorization.openKeyBrowserVertical.e2e.test.ts
