# Changesets must classify compatibility accurately. Preparing a major changeset
# is allowed; changing a package's actual major version still requires sign-off.
# Release/versioning workflows keep their existing authorization checks.
name: Major release guard

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signoff:
    name: Major release sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Test the release guards
        run: node --test .github/scripts/check-major-release-signoff.test.mjs .github/scripts/check-npm-release-provenance.test.mjs .github/scripts/github-releases.test.mjs .github/scripts/publish-in-dependency-order.test.mjs .github/scripts/courier-stable-stage.test.mjs .github/scripts/scoped-version.test.mjs .github/scripts/release-cutover.test.mjs .github/scripts/release-workflow-pins.test.mjs

      - name: Check the release scope
        run: node .github/scripts/scoped-version.mjs check

      - name: Check version bumps while allowing major changesets
        run: node .github/scripts/check-major-release-signoff.mjs prepare-pr "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
