name: Install gitleaks
description: >-
  Download the pinned gitleaks release, verify its sha256, and put it on PATH.
  Any download, checksum or version mismatch fails the step.

runs:
  using: composite
  steps:
    - name: Install gitleaks 8.30.1
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt.
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/gitleaks-bin"
        mkdir -p "$dir"
        tarball="$dir/gitleaks.tar.gz"
        curl --fail --silent --show-error --location --retry 3 \
          --output "$tarball" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict -
        tar -xzf "$tarball" -C "$dir" gitleaks
        rm "$tarball"
        test "$("$dir/gitleaks" version)" = "$GITLEAKS_VERSION"
        echo "$dir" >> "$GITHUB_PATH"
